# mocks.local.example.yaml — copy to `mocks.local.yaml` to use it.
#
# `mocks.local.yaml` is GITIGNORED: your personal testing file, never pushed.
# When present, the engine REPLACES the listed steps on every `next` / `step-action`.
# Everything NOT listed runs for real, so you keep driving the release through Scout
# normally — the mocked steps just resolve themselves.
#
# TWO layers of control (see `python -m orchestrator.cli mock-spec` for the live list):
#
#   1) Engine-level — works for EVERY non-gate step in EVERY phase:
#        outcome: done            # mark complete, skip its real work
#        outcome: blocked         # hold for the owner (rehearse the block path)
#        note: "..." / reason: "..."
#
#   2) Per-step payload overrides — only where a step DECLARES them (its MOCKABLE
#      spec). These keep the action REAL but redirect it. Currently:
#        preflight.notice          send_to: ["me@microsoft.com"]   # real email, only to me
#        preflight.flight_reminder send_to: me                     # real Teams post, my own chat
#      Unknown keys are reported back as `unknown_overrides` so typos show.
#
# Gate steps (🚦 below) are NOT mockable — a gate needs a real human decision.

# ============================================================================
# ACTIVE example (delete/edit as you like): real run, skip the CG query.
# ============================================================================
preflight.cg:
  outcome: done
  note: "mocked: CG clean for local testing"


# ============================================================================
# FULL SAFE-TEST PROFILE — uncomment ALL of this to run the whole flow with ZERO
# real side-effects (no emails, no Teams posts, no ADO writes, no live az/MCP).
# Clears the entry gate offline and mocks every Phase-0 side-effect.
#   Then just drive the release through Scout normally ("start a test release for
#   <month>", "continue", …) — nothing special to type. Still sign the attest items
#   (oncall_window, saw_ame, yubikey, play_console_access, confirm_reminders, vitals)
#   when Scout asks — those are human confirmations with no side-effects.
# ============================================================================
# # -- entry gate: force the real ADO/config/MCP checks to pass --
# readiness.build_access: { outcome: pass }
# readiness.mcp_servers:  { outcome: pass }
# readiness.silent_perms: { outcome: pass }
# readiness.adx_access:   { outcome: pass }
# readiness.oncall_now:   { outcome: pass }
# # -- Phase 0: no real sends / writes / network --
# preflight.notice:          { outcome: done }     # or { send_to: ["you@microsoft.com"] } to really receive it
# preflight.flight_reminder: { outcome: done }     # or { send_to: me } to really get it in your chat
# preflight.lockdown:        { outcome: done }
# preflight.breaking:        { changelog: "vNext\n----\n- [MINOR] x (#1)\nVersion 1.0.0\n" }
# preflight.cg:              { alerts: [] }
# preflight.cron:            { run: { queueTime: "2026-08-14T12:00:00Z", result: succeeded } }
# preflight.wiki:            { outcome: done }


# ============================================================================
