# Release-announcement cc groups — maintained manually.
#
# WHY THIS FILE EXISTS: the "General" channel release announcement cc's four Teams TAGS
# (CP/Intune, LTW, OneAuth, Native Auth). The microsoft_teams MCP CANNOT @-mention a Teams
# tag (it maps the id to an unknown user), and fetching tag membership via Graph needs
# TeamworkTag.Read (interactive-only, which breaks silent runs). So we maintain the tag
# MEMBERS here and @-mention the individuals instead (user mentions render correctly).
#
# Each member: {name, email}. `email` is the UPN used as the mention id; `name` is the
# @chip text. Keep in sync by hand when a tag's membership changes.
