# Release Orchestrator — workflow topology (phases, schedule anchors, and step dependency graph).
# Step metadata (name, kind, requires_approval, required_tools, effect_mode, write_command,
# KNOWLEDGE, MOCKABLE, AUTOMATION) lives inside each co-located module `steps/<phase>/<step>.py`.
# Pure YAML-only human/gate/placeholder steps (without a Python module) declare `name` and `kind` inline.

phases:
  - id: preflight
    name: "Pre-flight & Code Complete"
    anchor: "CCD-7"
    steps:
      - { id: notice }
      - { id: flight_reminder }
      - { id: lockdown }
      - { id: breaking }
      - { id: cg }
      - { id: oneauth_access }
      - { id: cron }
      - { id: vitals }

  - id: ccd
    name: "Code Complete Day"
    anchor: "CCD"
    steps:
      - { id: final_reminder }
      - { id: pr_reminder }
      - { id: localization }
      - { id: localization_pr, depends_on: [localization] }

  - id: build_verify
    name: "Build & Lib Verification"
    anchor: "CCD+1"
    show_pipeline_runs: true
    steps:
      - { id: checker_fired }
      - { id: orchestrator_health, depends_on: [checker_fired] }
      - { id: mrwp_ecs, depends_on: [orchestrator_health] }
      - { id: mrwp_local, depends_on: [mrwp_ecs] }
      - { id: auth_ecs, depends_on: [mrwp_local] }
      - { id: telemetry_verify, depends_on: [auth_ecs] }
      - { id: rc_report_notify, depends_on: [auth_ecs] }
      - { id: rc_report_gate, name: "Decide RC quality gate after reviewing report", kind: approval_gate, depends_on: [telemetry_verify, rc_report_notify] }

  - id: bug_bash
    name: "Test / Bug Bash"
    steps:
      - { id: clone_plans_broker, depends_on: [build_verify.mrwp_ecs, build_verify.mrwp_local] }
      - { id: clone_plans_auth, depends_on: [build_verify.auth_ecs] }
      - { id: ui_test_status, depends_on: [clone_plans_broker, clone_plans_auth, build_verify.auth_ecs] }
      - { id: distribute_tests, depends_on: [ui_test_status] }
      - { id: send_invite, depends_on: [clone_plans_broker, clone_plans_auth] }
      - { id: activate_chat, depends_on: [send_invite] }
      - { id: bugbash_updates, depends_on: [activate_chat, ui_test_status] }
      - { id: notify_native_auth, depends_on: [clone_plans_broker] }
      - { id: ui_failures, name: "Review Phase 2 automation failures (Broker + Authenticator)", kind: human_action, depends_on: [ui_test_status] }
      - { id: native_auth_signoff, depends_on: [notify_native_auth] }
      - { id: bugbash_complete, name: "Bug bash complete + signed off", kind: approval_gate, depends_on: [ui_failures, native_auth_signoff] }

  - id: finalize
    name: "Finalize & Publish"
    steps:
      - { id: remove_rc_tags_gate, depends_on: [bug_bash.bugbash_complete] }
      - { id: orchestrator_finalization, depends_on: [remove_rc_tags_gate] }
      - { id: integ_prs, depends_on: [orchestrator_finalization] }
      - { id: publish_notes_gate, depends_on: [orchestrator_finalization] }
      - { id: verify_pub, depends_on: [publish_notes_gate] }
      - { id: verify_release_notes, depends_on: [publish_notes_gate] }
      - { id: oneauth_common_pr, depends_on: [verify_pub] }
      - { id: release_announcement, depends_on: [verify_pub, verify_release_notes] }
      - { id: final_status_email, depends_on: [release_announcement] }

  - id: rollout_start
    name: "Rollout Start"
    steps:
      - { id: identify_auth_build, depends_on: [finalize.orchestrator_finalization] }
      - { id: tag_authenticator, depends_on: [identify_auth_build] }
      - { id: wiki_payload, depends_on: [tag_authenticator] }
      - { id: notice, depends_on: [wiki_payload] }
      - { id: signoff_start, depends_on: [notice] }
      - { id: upload_whats_new, depends_on: [signoff_start] }
      - { id: upload_alpha, depends_on: [upload_whats_new] }
      - { id: beta_play_store, depends_on: [upload_alpha] }

  - id: monitor
    name: "Monitoring & Ring Advancement"
    steps:
      - { id: health_report, name: "Crash-% health report (halt/hotfix/proceed)", kind: auto, implementation: dummy, depends_on: [rollout_start.beta_play_store] }
      - { id: adoption, name: "Adoption % vs ring threshold", kind: auto, implementation: dummy, depends_on: [rollout_start.beta_play_store] }
      - { id: guards, name: "Check advancement guard rules", kind: auto, implementation: dummy, depends_on: [health_report, adoption] }
      - { id: advance, name: "Ring advance / halt decision", kind: approval_gate, depends_on: [guards] }
      - { id: progress_email, name: "Send progression email on advance", kind: auto, implementation: dummy, depends_on: [advance] }
      - { id: dashboard, name: "Update ADX dashboard params", kind: auto, implementation: dummy, depends_on: [advance] }
      - { id: crash_annot, name: "Flag new vs existing crashes", kind: human_action }
      - { id: hotfix_eval, name: "Surface hotfix-trigger criteria", kind: human_action }

  - id: partner
    name: "Partner Stores"
    steps:
      - { id: china, name: "China publish flow", kind: human_action }
      - { id: samsung, name: "Samsung portal upload", kind: human_action }
      - { id: ngms, name: "Verify nGMS upload", kind: auto, implementation: dummy, depends_on: [monitor.advance] }
      - { id: teams_dev, name: "Teams Devices announcement", kind: auto, implementation: dummy, depends_on: [monitor.advance] }
      - { id: approvals, name: "Track partner approvals + final notice", kind: auto, implementation: dummy, depends_on: [china, samsung, ngms] }
      - { id: review_times, name: "Maintain review-times table", kind: auto, implementation: dummy }

  - id: hotfix
    name: "Hotfix (conditional)"
    conditional: true
    steps:
      - { id: cherry, name: "Cherry-pick PRs", kind: auto, implementation: dummy }
      - { id: rebuild, name: "Rebuild + retain hotfix build", kind: auto, implementation: dummy, depends_on: [cherry] }
      - { id: smoke, name: "P0 smoke subset", kind: approval_gate, depends_on: [rebuild] }
      - { id: expedite, name: "Expedited rollout", kind: auto, implementation: dummy, depends_on: [smoke] }
      - { id: alpha_orgs, name: "Track alpha-mitigation orgs to remove", kind: auto, implementation: dummy }

  - id: close
    name: "Release Close"
    steps:
      - { id: closeout, name: "Close-out checklist (approvals/comms/bugs)", kind: auto, implementation: dummy, depends_on: [partner.approvals, monitor.advance] }
      - { id: done, name: "Release complete", kind: approval_gate, depends_on: [closeout] }


