# Release Orchestrator — workflow topology (phases, step ordering, dependencies, approval gates).
# Implementation details (name, kind, effect_mode, write_command, required_tools, KNOWLEDGE,
# MOCKABLE, AUTOMATION) live inside each step's co-located module `steps/<phase>/<step>.py`.
# Pure YAML-only human/gate/placeholder steps (without a Python module) declare `name` and `kind` inline.

version: 1

phases:
  - id: preflight
    name: "Pre-flight & Code Complete"
    checklist_phase: 0
    anchor: "CCD-7"
    execution: parallel
    steps:
      - { id: notice, depends_on: [], requires_approval: false, maps_to: [S0] }
      - { id: flight_reminder, depends_on: [], requires_approval: false, maps_to: [S3, S4, S5] }
      - { id: lockdown, depends_on: [], requires_approval: false, maps_to: [S1] }
      - { id: breaking, depends_on: [], maps_to: [S2] }
      - { id: cg, depends_on: [], maps_to: [S8] }
      - { id: oneauth_access, depends_on: [], maps_to: [S8] }
      - { id: cron, depends_on: [], maps_to: [S10] }
      - { id: vitals, depends_on: [], maps_to: [S9] }

  - id: ccd
    name: "Code Complete Day"
    checklist_phase: 1
    anchor: "CCD"
    execution: parallel
    steps:
      - { id: final_reminder, depends_on: [], requires_approval: false, maps_to: [P1-1] }
      - { id: pr_reminder, depends_on: [], requires_approval: false, maps_to: [P1-1b] }
      - { id: localization, depends_on: [], requires_approval: false, maps_to: [P1-2] }

  - id: build_verify
    name: "Build & Lib Verification"
    checklist_phase: 2
    anchor: "CCD+1"
    show_pipeline_runs: true
    execution: parallel
    steps:
      - { id: checker_fired, depends_on: [], maps_to: [B0] }
      - { id: orchestrator_health, depends_on: [checker_fired], maps_to: [B1] }
      - { id: mrwp_ecs, depends_on: [orchestrator_health], maps_to: [B2] }
      - { id: mrwp_local, depends_on: [mrwp_ecs], maps_to: [B3] }
      - { id: auth_ecs, depends_on: [mrwp_local], maps_to: [B3] }
      - { id: telemetry_verify, depends_on: [auth_ecs], requires_approval: false, maps_to: [B3] }
      - { id: rc_report_notify, depends_on: [auth_ecs], requires_approval: false, maps_to: [B4] }
      - { id: rc_report_gate, name: "Decide RC quality gate after reviewing report", kind: approval_gate, depends_on: [telemetry_verify, rc_report_notify], required_tools: [], maps_to: [B4] }

  - id: bug_bash
    name: "Test / Bug Bash"
    checklist_phase: 3
    execution: parallel
    steps:
      - { id: clone_plans_broker, depends_on: [build_verify.mrwp_ecs, build_verify.mrwp_local], maps_to: [T3] }
      - { id: clone_plans_auth, depends_on: [build_verify.auth_ecs], maps_to: [T3] }
      - { id: ui_test_status, depends_on: [clone_plans_broker, clone_plans_auth, build_verify.auth_ecs], maps_to: [T4] }
      - { id: distribute_tests, depends_on: [ui_test_status], requires_approval: true, maps_to: [T2] }
      - { id: send_invite, depends_on: [clone_plans_broker, clone_plans_auth], requires_approval: false, maps_to: [T2] }
      - { id: activate_chat, depends_on: [send_invite], requires_approval: false, maps_to: [T2] }
      - { id: bugbash_updates, depends_on: [activate_chat, ui_test_status], requires_approval: false, maps_to: [T2] }
      - { id: notify_native_auth, depends_on: [clone_plans_broker], requires_approval: false, maps_to: [T2] }
      - { id: ui_failures, name: "Review Phase 2 automation failures (Broker + Authenticator)", kind: human_action, depends_on: [ui_test_status], required_tools: [], maps_to: [T4] }
      - { id: native_auth_signoff, depends_on: [notify_native_auth], maps_to: [T5] }
      - { id: bugbash_complete, name: "Bug bash complete + signed off", kind: approval_gate, depends_on: [ui_failures, native_auth_signoff], required_tools: [] }

  - id: finalize
    name: "Finalize & Publish"
    checklist_phase: 4
    execution: parallel
    steps:
      - { id: remove_rc_tags_gate, depends_on: [bug_bash.bugbash_complete], maps_to: [F1] }
      - { id: orchestrator_finalization, depends_on: [remove_rc_tags_gate], maps_to: [F2] }
      - { id: integ_prs, depends_on: [orchestrator_finalization], requires_approval: false, maps_to: [F2] }
      - { id: publish_notes_gate, depends_on: [orchestrator_finalization], maps_to: [F4] }
      - { id: verify_pub, depends_on: [publish_notes_gate], maps_to: [F3] }
      - { id: verify_release_notes, depends_on: [publish_notes_gate], maps_to: [F5] }
      - { id: oneauth_common_pr, depends_on: [verify_pub], requires_approval: false, maps_to: [F5] }
      - { id: release_announcement, depends_on: [verify_pub, verify_release_notes], requires_approval: false, maps_to: [F4] }
      - { id: final_status_email, depends_on: [release_announcement], requires_approval: false, maps_to: [F4] }

  - id: rollout_start
    name: "Rollout Start"
    checklist_phase: 5
    execution: parallel
    steps:
      - { id: identify_auth_build, depends_on: [finalize.orchestrator_finalization], maps_to: [R1] }
      - { id: tag_authenticator, depends_on: [identify_auth_build], maps_to: [F6] }
      - { id: wiki_payload, depends_on: [tag_authenticator], requires_approval: false, maps_to: [S0, F6] }
      - { id: notice, depends_on: [wiki_payload], requires_approval: false, maps_to: [R1] }
      - { id: signoff_start, depends_on: [notice], requires_approval: false, maps_to: [R3] }
      - { id: upload_whats_new, depends_on: [signoff_start], requires_approval: false, maps_to: [R3] }
      - { id: upload_alpha, depends_on: [upload_whats_new], requires_approval: false, maps_to: [R3] }
      - { id: beta_play_store, depends_on: [upload_alpha], requires_approval: true, maps_to: [R3] }

  - id: monitor
    name: "Monitoring & Ring Advancement"
    checklist_phase: 6
    execution: parallel
    steps:
      - { id: health_report, name: "Crash-% health report (halt/hotfix/proceed)", kind: auto, implementation: dummy, depends_on: [rollout_start.beta_play_store], required_tools: [], maps_to: [M1] }
      - { id: adoption, name: "Adoption % vs ring threshold", kind: auto, implementation: dummy, depends_on: [rollout_start.beta_play_store], required_tools: [], maps_to: [M2] }
      - { id: guards, name: "Check advancement guard rules", kind: auto, implementation: dummy, depends_on: [health_report, adoption], required_tools: [], maps_to: [M4] }
      - { id: advance, name: "Ring advance / halt decision", kind: approval_gate, depends_on: [guards], required_tools: [], maps_to: [M3] }
      - { id: progress_email, name: "Send progression email on advance", kind: auto, implementation: dummy, depends_on: [advance], required_tools: [], maps_to: [M5] }
      - { id: dashboard, name: "Update ADX dashboard params", kind: auto, implementation: dummy, depends_on: [advance], required_tools: [], maps_to: [M6] }
      - { id: crash_annot, name: "Flag new vs existing crashes", kind: human_action, depends_on: [], required_tools: [], maps_to: [M7] }
      - { id: hotfix_eval, name: "Surface hotfix-trigger criteria", kind: human_action, depends_on: [], required_tools: [], maps_to: [M8] }

  - id: partner
    name: "Partner Stores"
    checklist_phase: 7
    execution: parallel
    steps:
      - { id: china, name: "China publish flow", kind: human_action, depends_on: [], required_tools: [], maps_to: [PT1] }
      - { id: samsung, name: "Samsung portal upload", kind: human_action, depends_on: [], required_tools: [], maps_to: [PT1s] }
      - { id: ngms, name: "Verify nGMS upload", kind: auto, implementation: dummy, depends_on: [monitor.advance], required_tools: [], maps_to: [PT2] }
      - { id: teams_dev, name: "Teams Devices announcement", kind: auto, implementation: dummy, depends_on: [monitor.advance], required_tools: [], maps_to: [PT3] }
      - { id: approvals, name: "Track partner approvals + final notice", kind: auto, implementation: dummy, depends_on: [china, samsung, ngms], required_tools: [], maps_to: [PT4] }
      - { id: review_times, name: "Maintain review-times table", kind: auto, implementation: dummy, depends_on: [], required_tools: [], maps_to: [PT5] }

  - id: hotfix
    name: "Hotfix (conditional)"
    checklist_phase: 8
    conditional: true
    execution: parallel
    steps:
      - { id: cherry, name: "Cherry-pick PRs", kind: auto, implementation: dummy, depends_on: [], required_tools: [], maps_to: [H1] }
      - { id: rebuild, name: "Rebuild + retain hotfix build", kind: auto, implementation: dummy, depends_on: [cherry], required_tools: [], maps_to: [H2] }
      - { id: smoke, name: "P0 smoke subset", kind: approval_gate, depends_on: [rebuild], required_tools: [], maps_to: [H3] }
      - { id: expedite, name: "Expedited rollout", kind: auto, implementation: dummy, depends_on: [smoke], required_tools: [], maps_to: [H4] }
      - { id: alpha_orgs, name: "Track alpha-mitigation orgs to remove", kind: auto, implementation: dummy, depends_on: [], required_tools: [], maps_to: [H5] }

  - id: close
    name: "Release Close"
    checklist_phase: 9
    execution: parallel
    steps:
      - { id: closeout, name: "Close-out checklist (approvals/comms/bugs)", kind: auto, implementation: dummy, depends_on: [partner.approvals, monitor.advance], required_tools: [], maps_to: [C1] }
      - { id: done, name: "Release complete", kind: approval_gate, depends_on: [closeout], required_tools: [] }

