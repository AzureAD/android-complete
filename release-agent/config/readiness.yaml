# Release readiness checklist — the ENTRY GATE.
# Every defined item is mandatory (optional `required: false` items are deprecated and forbidden).
# Each item declares `depends_on` (empty list `[]` = no prerequisites, runs immediately) and
# `required_tools` (tools/connectors needed to verify it). If a check fails because a tool or
# connector is missing or misconfigured, ONLY that specific item fails with its explicit reason
# while all other runnable checks continue executing to completion.

title: "Release readiness — entry gate"
instructions: >
  Complete all mandatory release-readiness checks and explicit human confirmations.
  Every check runs independently once its dependencies are met; a failure on one check
  never halts the remaining checks. Status and fact recording never authorize a send,
  upload, or release approval.
blocked_message: >
  This item is mandatory and is not satisfied, so the release cannot start. Resolve
  it — or, if you cannot, hand the release to another engineer who can (notify your
  manager / the release team). The new owner runs /release-agent and completes the
  checklist themselves.

items:
  - id: build_access
    label: "Build definitions accessible"
    text: "Release build definitions are accessible"
    verify: auto
    verifier: build_defs
    depends_on: []
    required_tools: [az]
    checks:
      - type: ado_build_def
        name: "Auth Client Android (Engineering #2828)"
        org: "https://identitydivision.visualstudio.com/"
        project: "Engineering"
        id: 2828
        url: "https://identitydivision.visualstudio.com/Engineering/_build?definitionId=2828"
      - type: ado_build_def
        name: "Android Build Release (One #397224)"
        org: "https://msazure.visualstudio.com/"
        project: "One"
        id: 397224
        url: "https://msazure.visualstudio.com/One/_build?definitionId=397224"

  - id: ccd_confirmed
    label: "CCD reconciled with pipeline"
    text: "The Code Complete Date is valid and reconciled with the pipeline (no unresolved override)"
    detail: "Scout validates the CCD end-to-end: an unconfirmed past default blocks until rescheduled, and it must agree with pipeline 3038's override (a differing override blocks until reconciled). Because every phase is CCD-relative, a wrong CCD misaligns the whole release. If the CCD leaves Phase 0 (CCD-7→CCD) with less than its normal 7-day window, Scout warns about the compressed prep window and still lets you proceed."
    verify: auto
    source: scout
    verifier: ccd_confirmed
    depends_on: []
    required_tools: [az]

  - id: mcp_servers
    label: "MCP servers registered"
    text: "The MCP servers the release needs (ICM on-call, Kusto/ADX telemetry, Teams comms) are registered in Scout"
    detail: "Scout checks the ICM + Kusto/ADX + Teams MCP servers are registered in your Scout config (needed for the on-call and telemetry checks, and to fill Teams comms gaps WorkIQ lacks)."
    verify: auto
    verifier: mcp_servers
    depends_on: []
    required_tools: []

  - id: m365_access
    label: "M365 connector capabilities"
    text: "Scout can read the owner's profile/calendar, complete configured roster, and Teams membership"
    detail: "Python verifies profile/calendar, exact configured roster (all member pages), and Teams membership directly via native WorkIQ CLI without shell query mangling."
    verify: auto
    verifier: m365_capabilities
    depends_on: []
    required_tools: [workiq]

  - id: teams_notify
    label: "Scout Teams notifications"
    text: "The daily release digest can reach you over the Scout Teams bot (in addition to email)"
    detail: "Scout checks the Teams relay is connected and the Scout bot is reachable, so the hourly `tick` digest can be delivered to you in Teams as well as email. Falls back to email-only if opted out."
    verify: auto
    source: scout
    verifier: teams_notify
    depends_on: []
    required_tools: [scout_teams_relay]
    opt_out: true

  - id: adx_access
    label: "ADX release dashboard"
    text: "You can query the ADX release-telemetry cluster (Scout verifies via Kusto)"
    detail: "Scout verifies you can query the [ADX release dashboard](https://dataexplorer.azure.com/dashboards/ab7abd7e-c36f-4ff0-88a7-aaa3ec014bd7)'s cluster."
    verify: auto
    source: scout
    verifier: kusto_access
    depends_on: []
    required_tools: [kusto]
    cluster_uri: "https://idsharedeus2.eastus2.kusto.windows.net"
    database: "d496be22d62a46b0a3cf67ea2e736fd8"

  - id: oncall_now
    label: "Not on-call now"
    text: "You are NOT currently the Android on-call (Scout verifies via ICM)"
    detail: "Scout verifies you are not the current Android [on-call](https://aka.ms/androidoncall) for Auth Client Android Shield."
    verify: auto
    source: scout
    verifier: oncall
    depends_on: []
    required_tools: [icm]
    team_id: 78848
    team_name: "Auth Client Android Shield"

  - id: play_console_access
    label: "Play Console access"
    text: "You can open the Play Console app dashboard (sign in and confirm it loads)"
    detail: "Open the [Play Console dashboard](https://play.google.com/console/u/0/developers/6720847872553662727/app/4972501392087484764/app-dashboard) and confirm it loads."
    verify: attest
    depends_on: []
    required_tools: []

  - id: oncall_window
    label: "Free during release window"
    text: "You are NOT scheduled on-call during the release window"
    detail: "Confirm you are NOT scheduled Android [on-call](https://aka.ms/androidoncall) during the release window."
    verify: attest
    depends_on: []
    required_tools: []
    window_start_anchor: "CCD-7"
    window_end_anchor: "CCD+14"

  - id: saw_ame
    label: "SAW + AME"
    text: "SAW machine and AME account are accessible — log into SAW, confirm the desktop loads, and sign in with your AME credentials"
    detail: "Log into [SAW](https://aka.ms/saw), confirm the desktop loads, and sign in with your AME credentials."
    verify: attest
    depends_on: []
    required_tools: []

  - id: yubikey
    label: "YubiKey in hand"
    text: "YubiKey in hand (no YubiKey? pick one up at Studio A 1909, Bldg 34/35 cafe, or order a DSR USB-C thumbdrive)"
    detail: "YubiKey in hand — no YubiKey? Studio A 1909, Bldg 34/35 cafe, or [order a DSR USB-C](https://cloudmfa-support.azurewebsites.net/SecurityKeyServices/SecurityKey)."
    verify: attest
    depends_on: []
    required_tools: []
