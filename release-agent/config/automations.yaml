# Per-release automation definitions — the SINGLE source of truth for which Scout
# automations a release provisions and WHICH STEPS each one drives (traceability).
#
# This is DATA, not code. The engine/CLI never call Scout's automation API; the
# skill does (m_create_automation / m_delete_automation). `automation plan
# --release <id>` reads this file + the release CCD and emits the concrete
# automations to create; each is then recorded in _automations.json WITH its steps,
# so automation<->step linkage is queryable and torn down cleanly at release close.
#
# Timing is NOT specified here — it is DERIVED from each step module's
# `fire_at_local` (steps/<phase>/<step>.py CONFIG). All steps in one automation must
# share the same fire_at_local; a guardrail test enforces that every scheduled step
# (one that declares fire_at_local) is owned by exactly ONE automation here.
#
# Fields:
#   slug     : stable short id for this automation (used in the registry + names)
#   label    : the automation's short purpose (e.g. "morning reminders"). The full display
#              NAME is composed as "<release-id> · <scope> — <label>" where <scope> is the
#              phase's display name (from phases.yaml) or an explicit `scope:` override — see
#              orchestrator.automations.automation_name. This keeps every provisioned
#              automation's title consistent and scannable.
#   scope    : OPTIONAL override for the scope segment when an automation isn't bound to one
#              phase (e.g. "Phases 2-4"). Defaults to the `phase` display name.
#   phase    : the phase these steps belong to (all steps must be in it)
#   steps    : "<phase>.<step>" ids this automation runs, in order
#   every    : OPTIONAL. If set (e.g. "10 minutes"), this is an INTERVAL/poller
#              automation on that cadence instead of a one-shot at a step's
#              fire_at_local. Interval automations may share a step with a
#              time-of-day one (e.g. noon triggers localization, a poller watches it)
#              and their steps need not declare fire_at_local.
#   purpose  : one-line description (stored in the registry)
#   cleanup_when : REQUIRED lifecycle rule for the central cleanup planner:
#              steps_done | steps_settled | phase_done:<phase> |
#              step_flag:<phase.step>:<data-key> | release_done | manual
#              OR rules may be listed. A halted release suspends work; completion
#              retires explicitly release-scoped nonmanual workers regardless of rule.
#              Pending required delivery/completion defers step cleanup. Use phase_done
#              for workers that outlive their initial trigger step.

version: 1

automations:
  - slug: ccd-morning
    label: "morning reminders"
    phase: ccd
    steps:
      - ccd.final_reminder      # email: code complete is TODAY
      - ccd.pr_reminder         # Teams: merge required PRs before the 11 PM cut
    cleanup_when: steps_done
    purpose: "Send the CCD-day code-complete email + the Code reviews PR-merge reminder"

  - slug: ccd-noon
    label: "noon localization"
    phase: ccd
    steps:
      - ccd.localization        # trigger pipeline 405133 (isCreatePrSelected=true)
    cleanup_when:
      - step_flag:ccd.localization:started_at
      - steps_done
      - phase_done:ccd
    purpose: "Trigger the localization pipeline at noon"

  - slug: ccd-localization-poller
    label: "localization poller"
    phase: ccd
    every: "1 hour"
    on_demand: true
    steps:
      - ccd.localization        # poll the triggered run (check-localization)
    cleanup_when:
      - steps_settled
      - phase_done:ccd
    purpose: "Poll localization hourly; warn at 4 PM Los Angeles time if unmerged, then omit localization at 6 PM so the release proceeds"

  # ON-DEMAND (not provisioned at release start). Created only when Build & RC
  # Verification is holding on an in-flight re-triggered RC (the human ran
  # `rc-retriggered`); torn down when `poll-rc` reports `resolved`. Interval automation,
  # so its step needs no fire_at_local.
  - slug: build-verify-rc-poller
    label: "RC verification poller"
    phase: build_verify
    every: "30 minutes"
    on_demand: true
    steps:
      - build_verify.rc_report  # poll the in-flight RC (poll-rc): re-gate on completion, nudge at 6h
    cleanup_when: phase_done:build_verify
    purpose: "Poll a re-triggered RC every 30 min; hold while in-flight, re-apply the gate on completion, courtesy-nudge the owner at 6h"

  # ON-DEMAND (not provisioned at release start). Created when `bugbash_updates` fires the
  # first progress post; drives `post-bugbash-update` every 3h during working hours
  # (09:00–18:00 LA, weekdays, skipping US holidays). Torn down when the tick reports
  # a successfully acknowledged final summary or the phase completes. Interval
  # automation, so its step needs no fire_at_local.
  - slug: bug-bash-update-poller
    label: "bug-bash update poller"
    phase: bug_bash
    every: "3 hours"
    on_demand: true
    steps:
      - bug_bash.bugbash_updates  # post-bugbash-update reads the interval above
    cleanup_when:
      - step_flag:bug_bash.bugbash_updates:poll_complete
      - phase_done:bug_bash
    purpose: "Post a Bug Bash progress update at the configured interval (working hours); @mention owners with remaining tests; stop when all complete or the owner signs off"
