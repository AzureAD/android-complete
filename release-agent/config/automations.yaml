# Per-release automation definitions.
# Step membership and fire_at_local are single-sourced on each step module (`AUTOMATION` / `AUTOMATIONS`).

version: 2
provider_defaults:
  model: auto
  enabled: true
  triggerType: schedule
  conditionCheckInterval: 15
  browserHeadless: true
  teamsNotify: never
automations:
- slug: push-reminders
  label: push reminders
  scope: Release-wide
  prompt_kind: push-reminders
  required_on_start: true
  every: 1 hour
  steps: []
  cleanup_when: release_done
  purpose: Advance the pinned release, recover owned work and deliver the eligible owner digest
- slug: daily-status-email
  label: daily status email
  scope: Phases 2–4
  prompt_kind: daily-status-email
  every: 1 hour
  steps: []
  cleanup_when: phase_done:finalize
  purpose: Send the partner status email on the first eligible owner-local business-day tick at or after
    17:00
- slug: finalize-orchestrator-poller
  label: Release Orchestrator poller
  phase: finalize
  every: 2 hours
  cleanup_when: steps_done
  purpose: Poll final release orchestration every 2 hours until the GitHub release-notes gate, capture
    final build identities, and escalate once after 8 hours
- slug: ccd-morning
  label: morning reminders
  phase: ccd
  cleanup_when: steps_done
  purpose: Send the CCD-day code-complete email + the Code reviews PR-merge reminder
- slug: ccd-noon
  label: noon localization
  phase: ccd
  cleanup_when:
  - step_flag:ccd.localization:started_at
  - steps_done
  - phase_done:ccd
  purpose: Launch localization at noon through launch-localization auto-approval; record-localization-run
    is recovery only
- slug: ccd-localization-poller
  label: localization poller
  phase: ccd
  every: 1 hour
  on_demand: true
  provision_when: step_status:ccd.localization:in_flight
  cleanup_when:
  - steps_settled
  - phase_done:ccd
  purpose: Poll localization with positive run-result/task evidence; escalate unresolved evidence at 3h,
    warn on unmerged PRs at 4 PM Los Angeles and omit them at 6 PM
- slug: build-verify-rc-poller
  label: RC verification poller
  phase: build_verify
  every: 30 minutes
  on_demand: true
  provision_when: step_status:build_verify.mrwp_ecs:in_flight
  cleanup_when: phase_done:build_verify
  purpose: Poll a re-triggered RC every 30 min; hold while in-flight, re-apply the gate on completion,
    courtesy-nudge the owner at 6h
- slug: bug-bash-update-poller
  label: bug-bash update poller
  phase: bug_bash
  every: 3 hours
  on_demand: true
  cleanup_when:
  - step_flag:bug_bash.bugbash_updates:poll_complete
  - phase_done:bug_bash
  purpose: Post a Bug Bash progress update at the configured interval (working hours); @mention owners
    with remaining tests; stop when all complete or the owner signs off
