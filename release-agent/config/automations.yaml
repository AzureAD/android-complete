# Per-release unified automation accelerator.
# Automations are non-blocking convenience accelerators: disabling or deleting them
# never blocks or breaks interactive or manual workflow progression.

version: 2
provider_defaults:
  model: auto
  enabled: true
  triggerType: schedule
  conditionCheckInterval: 15
  browserHeadless: true
  teamsNotify: never
automations:
- slug: release-drainer
  label: release drainer
  scope: Release-wide
  prompt_kind: release-drainer
  daily_window: "07:00-19:00/2h"
  steps: []
  cleanup_when: release_done
  purpose: Run every 2 hours from 7:00 AM to 7:00 PM to drain eligible steps from entry gate through
    release completion, write drain-runs.jsonl, and send paced Scout bot + email calls-to-action
