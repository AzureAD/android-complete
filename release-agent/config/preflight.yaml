# Config for the REAL Phase-0 pre-flight agents (deterministic; az CLI / HTTP).
#
# Unlike the readiness scout-assisted checks (ICM/Kusto, which have no CLI and are
# run by the skill via MCP), these steps talk to systems that DO have a CLI/HTTP
# surface, so they are plain Python agents — testable and LLM-free. In a dry-run
# release they SIMULATE (no network, no writes); only a real release acts.

version: 1

# Step `cg` (maps_to S8): "Report critical CG alerts".
# Component Governance alerts for the governed repo, read (read-only) from the CG
# governance host via `az rest`. Reports ACTIVE alerts grouped by severity and
# surfaces High/Critical. Report-only — never blocks the release.
cg:
  resource: "499b84ac-1321-427f-aa17-267ca6975798"     # Azure DevOps resource id (for `az rest`)
  governance_host: "https://msazure.governance.visualstudio.com"
  project_id: "b32aa71e-8ed2-41b2-9d77-5bc261222004"   # msazure/One
  governed_repo_id: 104410                              # AD-MFA-phonefactor-phoneApp-android
  branch: "working"
  high_severities: ["critical", "high"]                # surfaced/flagged as high-priority

# Step `cron` (maps_to S10): "Verify Calendar Checker scheduled".
# Pipeline 3038's cron lives in YAML (not exposed in definition triggers), but its
# build history proves the schedule is FIRING: a recent `schedule`-reason run means
# the Calendar Checker is live. Blocks if there's no recent scheduled run (stale).
cron:
  pipeline_id: 3038
  org: "https://identitydivision.visualstudio.com"
  project: "Engineering"
  name: "Code Complete Calendar Checker"
  max_staleness_days: 2                                 # a daily cron should never be older than this


# Step `breaking` (maps_to S2): "Detect BREAKING-OneAuth + draft comms".
# common-for-android records breaking changes as [MAJOR] entries in changelog.txt.
# The unreleased "vNext" section holds the changes shipping in THIS release, so we
# scan only that section. Any [MAJOR] there is a breaking change OneAuth must hear
# about — the agent lists them and drafts the comms; a human sends it.
breaking:
  changelog_url: "https://raw.githubusercontent.com/AzureAD/microsoft-authentication-library-common-for-android/dev/changelog.txt"
  section: "vNext"          # scan the unreleased section only
  breaking_tag: "[MAJOR]"   # breaking-change marker convention in this changelog

# Step `wiki` (maps_to S0): "Create release payload wiki subpage".
# Creates the per-release payload page under the standing history parent page.
# Phase 2 (step B6) later writes the built versions into this same page.
wiki:
  org: "https://identitydivision.visualstudio.com"
  project: "IdentityWiki"
  wiki: "IdentityWiki.wiki"
  parent_path: "/IdentityWiki/Services/Microsoft Authenticator/Release/Android/Monthly Releases Payloads History"
  # Child page name = "<Month> <Year> Release" (e.g. "August 2026 Release").
  # If that page already exists, the agent NOTIFIES and creates the next free
  # numbered page instead ("August 2026 2 Release", "August 2026 3 Release", ...).

# Step `lockdown` (maps_to S1): "Detect lockdown/holiday overlap".
# The CCOA "No-Fly Zones" source is an AAD-gated web app, so it can't be read by
# deterministic Python — the SKILL scrapes it via the authenticated browser and
# passes the periods to `check-lockdown`, which decides overlap DETERMINISTICALLY.
# Only periods whose Environment is Production BLOCK the release; Banner-only
# advisories are ignored. Overlap is checked against the release window
# CCD-7 .. CCD+14. On overlap the step holds for the owner (who runs set-ccd).
lockdown:
  url: "https://prod.change-manager.msidentity.com/ccoa-periods"
  blocking_environment: "Production"     # only Production-env CCOA periods block
  window_start_anchor: "CCD-7"
  window_end_anchor: "CCD+14"

# Step `notice` (maps_to S0): "Send early release notice".
# Fills the local template deterministically and sends it. RECIPIENTS: in a
# dry-run every outbound email goes to the release owner (safe rehearsal); a live
# release uses the real `recipients` list below. See EXTERNAL-REFERENCES.md.
notice:
  template: "templates/early-code-complete-notice.md"
  variant: "initial"                     # initial (CCD-7) | update (CCD-day)
  recipients:                            # LIVE only; dry-run redirects to owner
    - "androididentity@microsoft.com"    # "Azure Identity Android SDK"
    - "jialh@microsoft.com"

# Step `flight_reminder` (maps_to S3/S4/S5): "Feature-owner flight & string reminders".
# Three checklist reminders combined into ONE Teams message to the Android Core Team
# group chat. Scout-assisted (Teams send needs WorkIQ). DRY-RUN → the message goes to
# the release owner's own Teams chat; LIVE → the group chat below. See EXTERNAL-REFERENCES.md.
flight_reminder:
  live_chat_id: "19:976a859f167f44e59c4ceca8b1d23581@thread.v2"   # "Android Core Team"
  live_chat_name: "Android Core Team"
  links:
    variable_group: "https://identitydivision.visualstudio.com/Engineering/_library?itemType=VariableGroups&view=VariableGroupView&variableGroupId=40&path=release"
    premortem_example: "https://microsoft-my.sharepoint-df.com/:w:/p/rapong/cQpEZp0cXp1sQYo4A4M3PQWCEgUCDj364FJa-rq-msg59WlBsw"
    localization: "https://eng.ms/docs/microsoft-security/identity/entra-developer-application-platform/auth-client/authn-sdk-msal-android/android-auth-libraries/releases/combined-release-checklist/localization"
    ecs_flight_history: "https://msazure.visualstudio.com/One/_git/AD-MFA-phonefactor-phoneApp-android?path=/PhoneFactor/ExperimentationLibrary/src/main/java/com/microsoft/authenticator/experimentation/ecs/entities/EcsFlight.kt&version=GBworking"


