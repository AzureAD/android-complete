# Step knowledge base — reference/help content the skill uses to answer a user's
# questions about a step ("what does this do?", "where do I find X?", "how do I
# resolve it?"). This is DATA (not code): edit here to keep answers accurate.
#
# Keyed by "<phase>.<step>". Fields (all optional):
#   summary : one-line description
#   what    : what the step does / why it matters
#   who     : who owns / is responsible for the step's action
#   where   : navigation / where to look (list of precise paths)
#   how     : how to complete or resolve it
#   links   : [{name, url}] reference links
#   faqs    : [{q, a}] common questions with accurate answers
#
# A step MODULE may also declare KNOWLEDGE (co-located); the resolver overlays the
# module on top of this file, so code and this data compose. Steps without an entry
# report "no knowledge yet" honestly rather than guessing.

version: 1

# ============================== Phase 0 · preflight ==============================

preflight.notice:
  summary: "Email the early code-complete notice to the Android distribution list."
  what: >
    Sends a heads-up that code complete for the month's release is approaching, so
    teams stop landing feature work and switch to the hotfix cherry-pick process
    after code complete. Filled from a local template with the CCD and release owner.
  how: >
    Scout resolves the email (subject, HTML body, recipients) and sends it via
    WorkIQ, then records the step. Recipients are the configured distribution list;
    for a test, redirect with the `send_to` mock knob.
  links:
    - name: "Hotfix cherry-pick guide (linked in the email)"
      url: "https://eng.ms/docs/microsoft-security/identity/entra-developer-application-platform/auth-client/microsoft-authenticator/microsoft-authenticator/release/cherry-pick-to-hotfix-guidelines"
  faqs:
    - q: "Who receives it?"
      a: "The configured distribution list (androididentity@microsoft.com, jialh@microsoft.com). Redirect for a test with preflight.notice.send_to."
    - q: "What's the difference between the 'initial' and 'update' variant?"
      a: "'initial' is the CCD-7 heads-up; 'update' is the CCD-day reminder ('code complete is Today'). Set via --param variant=update."

preflight.flight_reminder:
  summary: "Post the combined feature-owner reminders to the Android Core Team Teams chat."
  what: >
    One Teams message with four reminders as code complete approaches: update local
    flights, write flight pre-mortem docs, merge user-facing strings by CCD-7, and
    complete the feature-flag freeze / default-OFF review.
  how: >
    Scout posts the message to the Android Core Team group chat and records the step.
    For a test, redirect to your own chat with the `send_to: me` mock knob.
  links:
    - name: "release variable group (local flights)"
      url: "https://identitydivision.visualstudio.com/Engineering/_library?itemType=VariableGroups&view=VariableGroupView&variableGroupId=40&path=release"
    - name: "Localization instructions"
      url: "https://eng.ms/docs/microsoft-security/identity/entra-developer-application-platform/auth-client/authn-sdk-msal-android/android-auth-libraries/releases/combined-release-checklist/localization"
    - name: "EcsFlight.kt history (flag-freeze review)"
      url: "https://msazure.visualstudio.com/One/_git/AD-MFA-phonefactor-phoneApp-android?path=/PhoneFactor/ExperimentationLibrary/src/main/java/com/microsoft/authenticator/experimentation/ecs/entities/EcsFlight.kt&version=GBworking"
  faqs:
    - q: "Why CCD-7 for strings?"
      a: "Strings merged inside the 1-week window aren't guaranteed to be localized in time, so user-facing strings must land by CCD-7."

preflight.confirm_reminders:
  summary: "Attest that feature owners completed the reminded pre-code-complete work."
  what: >
    Sending the reminders doesn't prove the work got done. This step holds until the
    owner confirms feature owners actually: updated local flights, wrote pre-mortem
    docs, merged user-facing strings by CCD-7, and left features default-OFF (or got
    default-ON approved in the release wiki).
  how: "Confirm with the feature owners, then mark the step done. If you can't confirm, leave it holding."

preflight.lockdown:
  summary: "Detect whether a CCOA lockdown / holiday no-fly zone overlaps the release window."
  what: >
    Reads the CCOA 'No-Fly Zones' and checks whether any PRODUCTION-environment
    lockdown overlaps the release window (CCD-7 through CCD+14). Banner-only
    advisories don't block; a Production overlap holds the step so the owner can
    shift the CCD past it.
  where:
    - "CCOA periods page: the change-manager site — 'Upcoming CCOA periods' and the current-year 'Past NoFly Zones' table."
  how: >
    Scout scrapes the page (AAD SSO), the engine decides overlap deterministically.
    On an overlap it names the clashing lockdown(s); shift the CCD with set-ccd if
    you want to proceed. On no overlap it passes.
  links:
    - name: "CCOA periods (change-manager)"
      url: "https://prod.change-manager.msidentity.com/ccoa-periods"
  faqs:
    - q: "Which lockdowns actually block?"
      a: "Only Production-environment CCOA periods that intersect CCD-7..CCD+14. Banner-only advisories are ignored."

preflight.breaking:
  summary: "Detect BREAKING-OneAuth changes in the common-for-android changelog and draft comms."
  what: >
    Scans the unreleased 'vNext' section of the common-for-android changelog for
    [MAJOR] (breaking) entries — the changes shipping in this release that OneAuth
    consumers must handle — and drafts the notification comms. Read-only.
  where:
    - "Source: the common-for-android changelog.txt (dev branch), 'vNext' section."
  how: "Review any detected [MAJOR] entries and send the drafted comms to the OneAuth team. No breaking changes → nothing to do."
  links:
    - name: "common-for-android changelog"
      url: "https://raw.githubusercontent.com/AzureAD/microsoft-authentication-library-common-for-android/dev/changelog.txt"

preflight.cg:
  summary: "Report active Component Governance alerts; block on High/Critical."
  what: >
    Reads Component Governance alerts for the governed Android repo and reports
    active alerts by severity. It BLOCKS (holds) when there are active High/Critical
    alerts — the release engineer fixes them and reruns the check. Overriding to ship
    WITHOUT a fix is allowed only with the release engineer's MANAGER's approval
    (recorded in the skip reason).
  who: >
    The RELEASE ENGINEER (release owner) is responsible for remediating Component
    Governance alerts — this includes creating the fix PR (e.g. bumping the flagged
    dependency to a patched version) and driving it to merge, not just pinging another
    team. CG remediation is a release-owner duty, not something delegated to the
    component owner by default. The ONE exception to fixing is an override to ship as-is,
    which is not the engineer's call alone — it requires their MANAGER's approval.
  where:
    - "Component Governance alerts page for the repo (see link) — review the active High/Critical items."
    - "The flagged dependency's version is pinned in the repo's version catalog (gradle/libs.versions.toml) or the module build.gradle — that's where the fix PR changes it."
  how: >
    Preferred path — FIX: as release engineer, open the alert, identify the flagged
    dependency and patched version, raise the fix PR (update the pin, e.g.
    httpcore5 5.3 -> 5.4.3), get it merged, then rerun this step to re-check.
    Override path — SHIP WITHOUT FIXING: this needs your MANAGER's explicit approval
    first. Once the manager signs off, skip the step with a reason that NAMES the
    approving manager and why (audited), e.g.
    `skip --release <id> --phase preflight --step cg --reason "High CG alert X — ship
    as-is approved by <manager alias> on <date>; fix tracked in <work item>"`.
    Never override on your own authority.
  faqs:
    - q: "Who fixes the alert / creates the PR?"
      a: "The release engineer (release owner). Remediating CG alerts — including authoring and landing the fix PR — is a release-owner responsibility, not the component owner's."
    - q: "Can I ship with an open High/Critical CG alert?"
      a: "Only as an override, and only with your MANAGER's approval. The release engineer cannot waive a High/Critical CG block on their own — get manager sign-off, then skip the step with a reason that records who approved it and links the follow-up fix. If there's no manager approval, fix the alert first."
    - q: "Does a Medium/Low alert block?"
      a: "No — only active High/Critical alerts block. Medium/Low are reported but don't hold the release."
  links:
    - name: "Component Governance alerts"
      url: "https://msazure.visualstudio.com/One/_componentGovernance/AD-MFA-phonefactor-phoneApp-android"

preflight.vitals:
  summary: "Attest that Google Play Console app health (Android vitals + Policy status) is acceptable."
  what: >
    Play Console has no API for policy status, so this is a manual confirmation:
    review the app's technical health (crash rate / ANR rate) and its policy standing
    (open issues or warnings), and confirm both are acceptable before code complete.
  where:
    - "Android vitals: Play Console → left panel → 'Monitor and improve' → 'Android vitals' → Overview."
    - "Policy status: Play Console → left panel → 'Monitor and improve' → 'Policy and programs' → 'Policy status'."
  how: >
    Open both pages, confirm crash/ANR are within acceptable bounds (no regression)
    and there are no open policy issues/warnings, then mark the step done. An
    unresolved policy issue or a vitals regression → leave it holding.
  links:
    - name: "Google Play Console"
      url: "https://play.google.com/console"
  faqs:
    - q: "Where do I find Android vitals?"
      a: "Play Console → left panel → Monitor and improve → Android vitals → Overview."
    - q: "Where is policy status?"
      a: "Play Console → left panel → Monitor and improve → Policy and programs → Policy status."

preflight.cron:
  summary: "Verify the Code Complete Calendar Checker pipeline is scheduled and firing."
  what: >
    Pipeline 3038's cron lives in YAML (not exposed in its triggers), so the check
    proves it's actually firing by confirming a recent schedule-reason run in its
    build history. Blocks if there's no recent scheduled run or it's stale.
  how: "If blocked, investigate the pipeline's schedule (it may be disabled/broken), fix it, and rerun the step — or skip to override."

# =============================== Phase 1 · ccd ===============================

ccd.final_reminder:
  summary: "Email the Android DL that code complete is TODAY (morning of CCD)."
  what: >
    The CCD-day final code-complete reminder email — the 'update' variant of the
    same notice template Phase 0 sends a week earlier at CCD-7. Tells everyone code
    complete is today and that any check-ins after it need the hotfix cherry-pick
    process + EM approval.
  who: >
    Scout sends it automatically (a scout step) on the morning of CCD, driven by the
    per-release CCD-morning automation. The release owner owns the content/recipients.
  how: >
    Runs via step-action → workiq_send_email. To test, redirect with the send_to
    mock knob (keeps the send real, points it at you). Sent ~09:00 local on CCD.
  faqs:
    - q: "How is this different from the Phase 0 notice?"
      a: "Same template, different variant/timing: Phase 0 'notice' sends the 'initial' variant at CCD-7; this sends the 'update' variant ('Today') on CCD morning."

ccd.pr_reminder:
  summary: "Teams reminder to the 'Code reviews' chat: merge required PRs before the 11 PM branch cut."
  what: >
    The morning-of-CCD Teams message telling engineers every required PR must be
    merged today before the release branch is cut automatically at 11:00 PM; if a
    required PR won't make it, request a CCD delay or a post-CCD cherry-pick; and
    merge any PR with user-facing strings before the localization pipeline runs at
    noon.
  who: >
    Scout posts it automatically (a scout step) on CCD morning. CCD-delay and
    cherry-pick requests must be approved by Moumita Ghosh (moghosh@microsoft.com).
  where:
    - "Target: the 'Code reviews' Teams chat (fixed chat id in the step CONFIG / EXTERNAL-REFERENCES.md)."
  how: >
    Runs via step-action → workiq_send_chat_message. To test, redirect with the
    send_to mock knob ('me' = your own chat).
  faqs:
    - q: "Who approves a CCD delay or cherry-pick?"
      a: "Moumita Ghosh (moghosh@microsoft.com) — both a Code Complete delay and a post-CCD cherry-pick require her approval."
    - q: "Why merge string PRs before noon?"
      a: "The localization pipeline is triggered at noon; strings merged after it aren't guaranteed to be localized this release."

ccd.localization:
  # Knowledge for this step is co-located in the step module (steps/ccd/localization.py
  # KNOWLEDGE) — the trigger→poll→timeout/complete→post-PR flow. Kept there so it
  # can't drift from the logic. No yaml override needed.

preflight.wiki:
  summary: "Create the per-release payload wiki subpage under the history parent page."
  what: >
    Creates '<Month> <Year> Release' under the standing Monthly Releases Payloads
    History page; Phase 2 later fills in the built versions. Duplicate-safe: if the
    month's page already exists it's left untouched and a numbered page is created.
  how: "Runs automatically; the created page link is stored on the step and shown in the status Details column."

# ======================= Phase 2 · build_verify (RC verification) =======================
# Read-only checks over the Engineering release pipelines: the checker (3038) fired the
# orchestrator (2828), the orchestrator is healthy + parked at Remove RC Tags, and both
# MRWP (2519) RC-testing runs (ECS + Local) ran to completion. Each blocks with the
# recovery TSG + escalation chat.

build_verify.checker_fired:
  summary: "Confirm the Code Complete Calendar Checker fired the release on the CCD."
  what: >
    The checker (def 3038) runs daily; its 'Trigger Monthly Release' job is SKIPPED on
    ordinary days and only runs (succeeds) on the actual Code Complete Day, when it
    launches the Release Orchestrator. This step scans the month's checker runs for the
    one whose 'Trigger Monthly Release' job succeeded.
  where:
    - "Code Complete Calendar Checker (def 3038): https://identitydivision.visualstudio.com/Engineering/_build?definitionId=3038"
  how: >
    If it blocks: before Code Complete Day this is EXPECTED (nothing has triggered yet).
    After the CCD, a missing/failed 'Trigger Monthly Release' means the release wasn't
    kicked off — check the checker's latest run and its schedule, fix, and rerun the step.
  faqs:
    - q: "It's blocked but the CCD hasn't arrived — is that a problem?"
      a: "No. The trigger job only runs on Code Complete Day; before then there's nothing to confirm. It clears once the checker fires the release."

build_verify.orchestrator_health:
  summary: "Confirm the Release Orchestrator is healthy and parked at the Remove RC Tags gate."
  what: >
    Finds this release's orchestrator run (def 2828) by its AuthenticatorBranch tag and
    confirms the pre-gate stages — Validate Branch and Versions, Create Release Branches,
    Trigger RC Testing — all succeeded, and that it is PAUSED at 'Remove RC Tags' (a manual
    approval the owner clears in a LATER phase). This step never approves that gate. Reports
    the RC versions (Common/MSAL/Broker).
  who: >
    Scout verifies it automatically (read-only). If a pre-gate stage failed, the RELEASE
    ENGINEER follows the failed stage's guidance + the recovery TSG, retries the stage, then
    reruns this step. Approving Remove RC Tags is a separate, later step — not here.
  where:
    - "Release Orchestrator (def 2828): https://identitydivision.visualstudio.com/Engineering/_build?definitionId=2828"
    - "Recovery TSG: https://eng.ms/docs/microsoft-security/identity/entra-developer-application-platform/auth-client/authn-sdk-msal-android/android-auth-libraries/releases/internal-release-checklist/release-orchestrator-recovery"
  how: >
    Each stage is descriptive — the failed stage's output explains the root cause and
    suggested fix. Follow it, click Retry on the failed stage, then rerun this step. If
    unresolved within 2h, escalate to the release Teams chat.
  faqs:
    - q: "It says 'parked at Remove RC Tags' — is that bad?"
      a: "No — that's the healthy expected state. The orchestrator pauses at Remove RC Tags for a human approval that happens in a later phase. Phase 2 only confirms it got there cleanly; it never approves it."
    - q: "A pre-gate stage failed — what do I do?"
      a: "Open the failed stage; its output describes the root cause + corrective action. Fix it, click Retry on that stage, then rerun this step. Recovery steps: the release-orchestrator-recovery TSG. Escalate to the release chat if stuck > 2h."

build_verify.mrwp_ecs:
  summary: "Confirm the ECS Monthly Release Work Pipeline run ran to completion + report its tests."
  what: >
    The orchestrator triggers MRWP (def 2519) twice — once per flight provider. This checks
    the ECS run 'ran to completion': EVERY stage executed (state completed, result
    succeeded/succeededWithIssues/failed). Red (failed) and yellow (warnings) stages are
    acceptable — they're triaged later. The ONLY blocker is a stage that never ran (pending,
    skipped, or canceled — i.e. the pipeline aborted partway). Also reports the Test-tab
    results (unit / instrumented / UI-automation totals).
  where:
    - "Monthly Release Work Pipeline (def 2519): https://identitydivision.visualstudio.com/Engineering/_build?definitionId=2519"
  how: >
    If it blocks, a stage never ran — the pipeline aborted. Open the run, find the stage that
    didn't execute, follow its output + the recovery TSG, Retry, then rerun this step. Failing
    tests do NOT block here; they're triaged in the bug-bash phase.
  faqs:
    - q: "The run has red stages / failing tests — why did it still pass?"
      a: "By design. A run is valid as long as every stage EXECUTED. Red/yellow stages and failed tests are expected at this checkpoint and triaged later. Only a stage that never ran (aborted pipeline) blocks."
    - q: "How is the ECS run identified?"
      a: "From the orchestrator run's RC-ECS=<build id> tag (or, for runs predating that tag, the orchestrator's trigger-task log). The run is then read directly by build id."

build_verify.mrwp_local:
  summary: "Confirm the Local-flighting MRWP run ran to completion + report its tests."
  what: >
    Local-flighting counterpart to the ECS check: confirms the Local MRWP (def 2519) run 'ran
    to completion' (every stage executed; skipped/canceled/pending = block) and reports its
    Test-tab results. Red/yellow stages and failed tests do NOT block — triaged later.
  where:
    - "Monthly Release Work Pipeline (def 2519): https://identitydivision.visualstudio.com/Engineering/_build?definitionId=2519"
  how: >
    Same as the ECS check: only a stage that never ran (aborted pipeline) blocks. Follow the
    aborted stage's output + the recovery TSG, Retry, rerun the step. Failing tests are triaged
    in the bug-bash phase.
  faqs:
    - q: "What's the difference between the ECS and Local runs?"
      a: "The orchestrator triggers MRWP twice with different flight providers — ECS (server-driven flights) and Local (local flight overrides). Both must run to completion; they're verified separately."

build_verify.rc_report:
  summary: "Email the RC verification report + apply the three-tier 90% UI gate (the Phase-2 go/no-go)."
  what: >
    Once the four verification steps have resolved the chain, this composes the Phase-2 RC report —
    checker fired, orchestrator healthy/parked, both MRWP runs' stage completion, and each run's
    failing test suites — from LIVE pipeline data and emails it to the release owner (on CCD+1). It
    is the terminal Phase-2 step and the go/no-go: after sending, `record-rc-report` applies a
    three-tier gate on the combined UI-automation pass rate across both MRWP runs — 100% is a clean
    pass, >=90% passes with a warning (investigate the failing tests in parallel, bug bash not
    blocked), and <90% BLOCKS for owner investigation. There is no separate approval gate.
    Scout-assisted (source: scout): the engine composes it; the skill sends via WorkIQ.
  who: >
    Scout composes the email; the skill sends it via workiq_send_email to the release owner
    (state.owner_email). Redirect for testing with the step's `send_to` payload knob.
  where:
    - "Release Orchestrator run (versions + parked gate): via the run link in the email + the step's Details"
    - "MRWP ECS / Local runs (Test tab): via the run links in the email + the step's Details"
  how: >
    If it blocks with 'no release owner email', set it with `set-owner --email <you@microsoft.com>`
    and rerun. On a clean/warn pass (>=90% UI) the release auto-advances into bug bash. On a <90%
    block, the owner investigates and rules on it (patch a real bug + re-trigger RC, or proceed as an
    automation flake): fix + re-run then `next`, or `skip --reason` to override.
  faqs:
    - q: "Who gets the email?"
      a: "The release owner on record (owner_email). It's a personal review copy, not the broad DL — the owner reviews the RC failures; the 90% UI gate then decides go/no-go automatically."
    - q: "Does the sim send this email?"
      a: "No. In a sim the step is marked done without sending; only the real skill flow composes + sends it via WorkIQ."

# =============================== Phase 3 · bug_bash ===============================

bug_bash.clone_plans_broker:
  summary: "Build this release's Broker test plan — a flat Broker suite + the Native Auth folder."
  what: >
    Each release gets a Broker test plan named 'Android Monthly Release - <Mon YYYY>' (e.g.
    'Android Monthly Release - Aug 2026', area 'Engineering\\Auth Client\\Broker\\Android').
    Instead of ADO's "Copy Test Plan" (which reproduces the master's whole 45-suite tree),
    Scout creates a fresh plan with exactly TWO top-level folders: (1) 'Manual Tests (Android
    Broker)' — one FLAT static suite of the manual-broker cases resolved from the master
    template (#2007357, subtree suite 2008656), each pinned to the two flight configurations
    (293 'RC MSAL - RC Broker' / ECS + 330 '… (LocalFlights)') → 2 points/case; and (2)
    'Manual Tests (Native Auth)' — the master's Native Auth subtree (#2864589) copied AS A
    FOLDER (its dynamic query suite preserved, so it stays current), pinned to ECS only (293).
    All cases are REFERENCED (shared, not duplicated). distribute_tests + the progress updates
    find the Broker suite by name, so it's a drop-in.
  who: "Scout runs it automatically during `next` (an agent step, via the ADO test-plan API)."
  how: >
    Idempotent — the new plan id is stashed on the step; a re-run re-confirms that plan
    exists and reports done without rebuilding. If the build fails (auth/API) the half-built
    plan is deleted and the step blocks with the ADO error; fix and `next`, or `skip
    --reason` to override.
  links:
    - name: "Broker master test plan (#2007357, Manual Tests subtree)"
      url: "https://identitydivision.visualstudio.com/Engineering/_testPlans/define?planId=2007357&suiteId=2008656"
    - name: "Broker test-plans doc"
      url: "https://eng.ms/docs/microsoft-security/identity/entra-developer-application-platform/auth-client/authn-sdk-msal-android/android-auth-libraries/releases/internal-release-checklist/test-plans"
  faqs:
    - q: "Why flat Broker but a folder for Native Auth?"
      a: "The Broker bug bash runs one manual-tests set that's easiest to track as a single flat list. Native Auth is a self-contained query suite, so it's kept as its own folder (still current, not flattened) — giving exactly two folders in the plan."
    - q: "Does it duplicate the test cases?"
      a: "No — it references the existing test cases (shared). Edit test cases only in the master template."
    - q: "Does it auto-update if the master changes later?"
      a: "The Broker suite is a frozen snapshot at build time (stable monthly cut). The Native Auth folder stays dynamic (its query re-resolves), so it reflects the current Native Auth cases. Rebuild (delete the plan id + re-run) to re-snapshot Broker."

bug_bash.clone_plans_auth:
  summary: "Create the Authenticator bug-bash query-based test suite for this release."
  what: >
    Creates a NEW query-based (dynamic) test suite under the standing 'MSAuthenticator
    Test Passes' plan (#714514, root suite 714515), named 'Android release/MM/DD/YYYY'
    from the CCD (e.g. CCD 2026-08-13 -> 'Android release/08/13/2026'). Its WIQL selects the Android bug-bash test cases
    (tag 'Android' + 'ReleaseBugBash', area 'Engineering\\ISP\\Identity Apps', not Closed
    — matches the current prod suite 3728419 'Android release/08/13/2026'). This is the
    Authenticator half of the old clone_plans step. It STOPS after creating the suite —
    assigning testers is a later, manual step.
  who: "Scout runs it automatically during `next` (an agent step, via the ADO test-suite create API)."
  how: >
    Idempotent — the created suite id is stashed on the step, and it also reuses an
    existing same-named suite rather than making a duplicate. If the create fails
    (auth/API), the step blocks with the ADO error; fix and `next`, or `skip --reason`.
  links:
    - name: "MSAuthenticator Test Passes plan (#714514)"
      url: "https://identitydivision.visualstudio.com/Engineering/_testManagement?_a=tests&planId=714514&suiteId=714515"
    - name: "How to make a test suite for bug bash (IDWiki 33580)"
      url: "https://identitydivision.visualstudio.com/IdentityWiki/_wiki/wikis/IdentityWiki.wiki/33580/How-to-make-test-suite-for-bug-bash-"
  faqs:
    - q: "Does it assign testers?"
      a: "No — it stops after creating the query-based suite. Assigning testers is done later (a separate, manual step)."
    - q: "What names the suite?"
      a: "From the CCD: 'Android release/MM/DD/YYYY' (e.g. CCD 2026-08-13 → 'Android release/08/13/2026'), matching prod."
    - q: "Which test cases does it include?"
      a: "The curated bug-bash set — Android test cases tagged 'ReleaseBugBash' (the tag also matches month-specific 'ReleaseBugBash<Month>' tags), not Closed. This matches prod; a broad 'all Android' filter would over-include (e.g. ComposeTesting/DarkMode cases)."

bug_bash.distribute_tests:
  summary: "Evenly distribute the manual bug-bash tests across the eligible team."
  what: >
    Combines the two manual test sets — Broker ('Manual Tests (Android Broker)' subtree,
    ~48 cases) + Authenticator (the ReleaseBugBash query set minus tags Automated/Blocked,
    ~26 cases) — and splits them EVENLY across the eligible team, keeping each test on its
    current assignee where possible (preference), only reassigning to hit an even count.
    Eligible = the roster DL 'androididentity@microsoft.com' MINUS the always-excluded
    people (jialh, moghosh, veenasoman), the release owner, and the current on-call
    engineer (OCE). Default assignee + the written field are both System.AssignedTo.
  who: >
    Scout computes the PREVIEW automatically during `next` (an agent step). Applying it is
    a separate, explicit action you trigger — it writes System.AssignedTo, which mutates
    the shared test-case work items (so this release's assignment becomes next release's
    default preference).
  how: >
    Preview: `distribute-tests --release <id> [--oce <upn>]` prints the per-tester table and
    stores the plan. Apply: `distribute-tests --release <id> --apply` writes the
    assignments. The OCE team id (ICM 78848) is the SAME source the entry gate's oncall_now
    check uses (read from readiness.yaml — no second copy).
  links:
    - name: "Broker test-plans doc"
      url: "https://eng.ms/docs/microsoft-security/identity/entra-developer-application-platform/auth-client/authn-sdk-msal-android/android-auth-libraries/releases/internal-release-checklist/test-plans"
    - name: "How to make a test suite for bug bash (IDWiki 33580)"
      url: "https://identitydivision.visualstudio.com/IdentityWiki/_wiki/wikis/IdentityWiki.wiki/33580/How-to-make-test-suite-for-bug-bash-"
  faqs:
    - q: "How is 'even' decided when counts don't divide evenly?"
      a: "target = total ÷ eligible; the remainder people (those with the most default tests) get one extra, so heavy-default folks keep their preference."
    - q: "Does applying it change the master plan?"
      a: "Yes — System.AssignedTo lives on the shared test-case work items, so the new assignee shows in the master and every plan referencing them. That's intentional: it carries the preference into the next release's clone."
    - q: "Who is excluded?"
      a: "Always: jialh, moghosh, veenasoman. Per-release: the release owner and the current on-call engineer (OCE, resolved via ICM team 78848 — the same team the entry gate checks)."

bug_bash.send_invite:
  summary: "Schedule the combined Bug Bash and send the Teams meeting invite."
  what: >
    Composes the Bug Bash Teams meeting from the release's real artifacts and sends the
    invite. Subject '<Month Year> Release Bug Bash'; ~2h; body has the Broker section
    (test plan + ECS/Local MRWP runs + the local-flights JSON from variable group 40) and
    the Auth App section (test suite + auth pipeline). Rendered from
    templates/bug-bash-invite.html (edit the file to restyle).
  who: >
    Scout composes it automatically during `next` (a scout step → workiq_create_event).
    Recipients are the Android Identity DL + the Dublin CIAM alias; redirect for a test
    with the send_to knob (keeps the send real, points it at you).
  how: >
    When: reached after 3pm or on a weekend → next business morning at 09:00; before 3pm on
    a weekday → later the same day. Weekends roll to Monday. Links come from the clone steps
    (Broker plan, Auth suite) and Phase 2 (ECS/Local MRWP runs); flags are fetched live from
    variable group 40. Blocks if the plans haven't been cloned yet.
  links:
    - name: "Local flags — variable group 40"
      url: "https://identitydivision.visualstudio.com/Engineering/_library?view=VariableGroupView&variableGroupId=40&path=release"
  faqs:
    - q: "When is it scheduled?"
      a: "After 3pm or on a weekend → next business morning (9am); before 3pm on a weekday → later the same day. Weekends always roll to Monday."
    - q: "Who gets invited?"
      a: "The Azure Identity Android SDK / Android Identity team (androididentity@microsoft.com) and idnadevexciamdublin@microsoft.com. For a test, the send_to knob redirects it to you."
    - q: "Where does the template live?"
      a: "templates/bug-bash-invite.html — edit it to restyle; the step always renders from that file."

bug_bash.notify_native_auth:
  summary: "One-shot Teams ping to the Native Auth release engineer that the bug bash is ready."
  what: >
    Sends ONE Teams message to the month's Native Auth Release Engineer (from the
    release-engineer schedule doc) telling them the bug bash is ready, that the Broker test
    plan now has a 'Manual Tests (Native Auth)' folder with their cases (linked), asking them
    to run their Native Auth tests at their earliest convenience, and to send the release
    owner a confirmation when done. Fired once and done — no poller/automation.
  who: >
    Scout runs it during `next` (a scout step). It resolves the Native Auth RE for the release
    month from the schedule doc (an inline hint seeds the likely alias; the skill confirms
    against the live doc), resolves their UPN (workiq_search_people), and sends a 1:1 Teams
    message (workiq_send_chat_message). Human fallback: if it can't resolve them it asks the
    owner for the alias, or holds the step.
  how: >
    The skill runs `record-nativeauth-notify --release <id> --engineer <alias-or-upn>` to mark
    it done (stores who was notified); without --engineer it holds the step for the owner.
    Idempotent — once an engineer is recorded it reports done without re-sending. Blocks if the
    Broker plan isn't built yet (needs the Native Auth suite link).
  links:
    - name: "Release engineer schedule (Native Auth RE column)"
      url: "https://eng.ms/docs/microsoft-security/identity/entra-developer-application-platform/auth-client/authn-sdk-msal-android/android-auth-libraries/releases/internal-release-checklist/release-engineer-schedule"
  faqs:
    - q: "Who receives the message?"
      a: "The Native Auth Release Engineer for the release month, from the schedule doc (e.g. Aug 2026 → silviu.petrescu). The inline hint in the step is confirmed against the live doc; update the hint when the schedule changes."
    - q: "Does it track their confirmation?"
      a: "No — it just asks them to reply to the release owner when they finish. It's a one-shot notification, not a poller."

bug_bash.activate_chat:
  summary: "Activate the Bug Bash meeting chat and store its id for the periodic updates."
  what: >
    A Teams meeting chat is DORMANT until it's activated once (first join, first message,
    or opening its Chat pane) — only then does it get a stable 19:meeting_…@thread.v2 id
    that automation can post to. This step resolves + activates that chat and stores the id
    on the step (data.chat_id) so the periodic-update step can post to it.
  who: >
    Scout resolves it during `next` (a scout step). Three tiers: (1) SEARCH the meeting
    chat by topic; (2) if dormant, ACTIVATE via Playwright (open the meeting in Teams web,
    click Chat); (3) HUMAN FALLBACK — if activation fails, the owner opens the meeting and
    clicks Chat / sends one message, then it's re-resolved.
  how: >
    The skill runs `record-bugbash-chat --release <id> --chat-id <resolved>` to store it
    and mark the step done. If it truly can't be resolved, the same command WITHOUT
    --chat-id holds the step for the owner (who activates the chat, then re-runs).
  faqs:
    - q: "Why can't it just post to the meeting chat directly?"
      a: "A freshly-scheduled meeting's chat has no thread yet — it must be activated once (join / message / open Chat). This step does that activation and captures the id so the recurring poster can reach it."
    - q: "What if Playwright can't open the chat?"
      a: "It falls back to the owner: open the meeting in Teams and click Chat (or send one message) to activate the thread, then re-run the step."

bug_bash.bugbash_updates:
  summary: "Post the first bug-bash progress update to the meeting chat and start the 2h update poller."
  what: >
    Reaching this step posts an initial progress update to the Bug Bash meeting chat and
    provisions the on-demand `bug-bash-update-poller` automation. Each update is grouped by
    each test's owner (System.AssignedTo, set by distribute_tests, read live from BOTH the
    Broker 'Manual Tests (Android Broker)' subtree and the Authenticator bug-bash suite).
    A test counts as done only when it PASSED (or is N/A); not-run, failed, and blocked all
    count as remaining and are LISTED (failed first, then blocked, then not-run) with links +
    state so failures are surfaced, not buried. Owners with any remaining test are
    @mentioned; owners who passed everything appear by name with an 'all completed' line (no
    mention). It is fire-and-continue — the step completes after the first post so the phase
    proceeds; the poller runs in the background.
  who: >
    Scout resolves it during `next` (a scout step). It gathers progress, posts the first
    update via `workiq_send_chat_message` (contentType html; the payload carries `_mentions`
    = [{id,upn,name}] — the skill builds the mentions array + matching <at id="i"> tags so
    owners with remaining tests are pinged), then provisions the poller.
  how: >
    After the first post, provision the poller (it's on-demand, so it is NOT in
    `automation plan` — create it directly like the RC poller): `m_create_automation`
    with name "Release <id> — bug-bash update poller", schedule "every 2 hours", and the
    prompt from this step's `automation_prompt(release, {interval: true})`; then
    `automation register --id <scout-id> --name "..." --release <id> --slug
    bug-bash-update-poller --step bug_bash.bugbash_updates`. Each tick runs
    `post-bugbash-update --release <id>` and acts on the decision (off_hours → nothing;
    post → send content+mentions to chatId; complete → send the completion summary, then
    DEREGISTER the poller). Blocks if the meeting chat isn't activated (run activate_chat).
  faqs:
    - q: "When do the updates run?"
      a: "Every 2 hours during working hours — 09:00–18:00 America/Los_Angeles, weekdays only, skipping hardcoded US federal holidays. Outside that window a tick returns off_hours and sends nothing; it resumes at 09:00 the next working day."
    - q: "When do the updates stop?"
      a: "Either automatically when every test is complete (a tick returns `complete`, posts a wrap-up, and deregisters the poller) OR when the owner attests the bugbash_complete gate (the skill deregisters the poller then)."
    - q: "Why group by AssignedTo instead of the test point's tester?"
      a: "The ADO test-point `tester` field is NOT synced with the case's System.AssignedTo. distribute_tests sets AssignedTo, so progress is grouped by AssignedTo to reflect who actually owns each test."

bug_bash.native_auth_signoff:
  summary: "The release engineer attests the Native Auth team finished + signed off."
  what: >
    The first of the two bug-bash sign-offs. No message is sent — the release engineer
    confirms the Native Auth team completed their tests and signed off (the confirmation they
    were asked to send back in notify_native_auth). The step completes once who signed off is
    recorded.
  who: "Scout runs it during `next` (a scout step); the release engineer confirms the sign-off."
  how: >
    Record with `record-native-auth-signoff --release <id> --by '<who>'` (marks done); without
    --by it holds for the owner until the sign-off arrives. Idempotent.
  faqs:
    - q: "What is this confirming?"
      a: "That the Native Auth team ran their tests and signed off — the confirmation they were asked to send back in notify_native_auth."

bug_bash.did_signoff:
  summary: "Request the DID sign-off from the DID point of contact (Sowmya Malayanur)."
  what: >
    The second of the two bug-bash sign-offs. Scout sends a 1:1 Teams message to the DID point
    of contact (Sowmya Malayanur, Sowmya.Malayanur@microsoft.com) asking for the DID sign-off
    (the message links the Broker test plan), then records it when it comes back. Completes
    once the DID sign-off is captured.
  who: >
    Scout runs it during `next` (a scout step). It composes the DID request and sends it to
    the DID contact (workiq_create_chat_by_email → workiq_send_chat_message); until the
    sign-off is recorded the step holds.
  how: >
    Record with `record-did-signoff --release <id> --by '<who>'` (marks done); without --by it
    holds for the owner (the request having been sent). Idempotent — once recorded it reports
    done without re-sending.
  links:
    - name: "DID point of contact — Sowmya Malayanur"
      url: "mailto:Sowmya.Malayanur@microsoft.com"
  faqs:
    - q: "Who is the DID contact?"
      a: "Sowmya Malayanur (Sowmya.Malayanur@microsoft.com) — Scout sends her the DID sign-off request when this step runs."

bug_bash.bugbash_complete:
  summary: "The release owner attests the Bug Bash is finished — the gate that closes the bash."
  what: >
    A human sign-off gate: the owner confirms the assigned tests have been run (or explicitly
    triaged/blocked) and the team agrees the bash is done. Approving it advances the release
    out of Phase 3. It also STOPS the periodic updates.
  who: >
    The owner approves it (`approve` / `done --step bugbash_complete`). Until then — or until
    every test auto-completes — the `bug-bash-update-poller` keeps posting every 2h.
  how: >
    When the owner signs off, DEREGISTER the bug-bash update poller so it stops posting:
    `automation list --release <id> --step-filter bug_bash.bugbash_updates --json` to find its
    id, then `automation deregister --id <id>`. (If all tests had already completed, the poller
    deregistered itself on its last `complete` tick — deregister is idempotent/safe to skip.)
  faqs:
    - q: "Can I sign off before every single test passes?"
      a: "Yes — this is a judgement gate. If the remaining tests are triaged/blocked and the team agrees the bash is done, approve it. It doesn't require 100% pass; that's what the sign-off is for."
    - q: "What stops the 2-hour chat updates?"
      a: "Two things: the poller stops itself when every test is complete, and approving this gate deregisters the poller. Either way the updates end when the bash is done."

# ========================== Entry gate · readiness ==========================
# Keyed "readiness.<item>". Queried via `gate-info --item <id>`. Same fields as the
# step entries (summary/what/who/where/how/links/faqs).

readiness.build_access:
  summary: "You have permission to both ADO orgs the release builds from."
  what: >
    Confirms you can reach the two build definitions this release drives — the
    BROKER pipelines in Engineering (Auth Client Android #2828, org
    identitydivision) and the AUTHENTICATOR pipelines in One (Android Build Release
    #397224, org msazure). Auto-verified via `az pipelines build definition show`;
    passes only if BOTH are accessible.
  who: >
    Scout verifies it automatically (a Python verifier — no user action) as long as
    you're signed into az with access to both orgs.
  where:
    - "Broker (Engineering #2828): https://identitydivision.visualstudio.com/Engineering/_build?definitionId=2828"
    - "Authenticator (One #397224): https://msazure.visualstudio.com/One/_build?definitionId=397224"
  how: >
    If it fails: run `az login`, then confirm you have access to BOTH orgs/projects
    — Engineering (identitydivision) for the Broker pipelines and One (msazure) for
    the Authenticator pipelines. The two orgs authenticate separately, so a token
    good for one may not cover the other; request access to whichever org is
    failing. Re-run the gate once fixed.
  faqs:
    - q: "Why check two organizations?"
      a: "The Android release spans both: the Broker libraries build in Engineering (identitydivision) and the Authenticator app builds in One (msazure). You need permission to both."
    - q: "It failed with a 401 — what now?"
      a: "Usually you're not signed into az, or you lack access to one of the two orgs (they're separate). Sign in / request access to the failing org, then re-run the gate."

readiness.ccd_confirmed:
  summary: "The Code Complete Date is a valid future date, reconciled with the pipeline."
  what: >
    Validates the CCD end-to-end, because every phase is CCD-relative and a wrong
    CCD misaligns the whole run. Two hard checks (either BLOCKS): the CCD must be
    FUTURE-DATED — a past CCD (e.g. a current-month release whose 2nd-Wednesday
    default already passed) can't be code-completed — and it must AGREE with
    pipeline 3038's override. Plus one advisory: if the CCD leaves Phase 0
    (CCD-7→CCD) with less than its normal 7-day window, Scout WARNS about the
    compressed prep window but lets you proceed.
  who: >
    Scout runs the check (`check-ccd`, reads the pipeline via az). On a past CCD or a
    differing pipeline override, Scout shows you the options and YOU decide the real
    date; Scout writes it with `set-ccd`. On a compressed Phase 0 window Scout warns
    and you choose to proceed or move the CCD out. If the pipeline can't be read, you
    confirm the CCD manually (attest fallback).
  where:
    - "CCD override variable — Broker pipeline (Engineering #3038): https://identitydivision.visualstudio.com/Engineering/_build?definitionId=3038"
  how: >
    Scout runs `check-ccd --json` and acts on the status: `past` → the CCD is before
    today; reschedule to a future date with `set-ccd --date <future> --confirm`
    (adopt a future pipeline override if one exists), re-check. `conflict` → pipeline
    override differs; pick which is right, `set-ccd`, re-check. `unreadable` → confirm
    the CCD by hand (attest). `match` → record the item pass. On `compressed: true`
    (any non-past status) Scout warns that Phase 0 has only `runway_days` of the
    normal 7 and lets you proceed or move the CCD.
  faqs:
    - q: "I started a release this month and the CCD is in the past — why?"
      a: "The default CCD is the 2nd Wednesday of the release month. If that day has already passed, the default is in the past and invalid. The gate blocks until you set a future Code Complete Date (or target a later release month)."
    - q: "Why does a CCD mismatch block the release?"
      a: "The phase schedule is computed from the CCD. If the pipeline is building to a different date than the orchestrator thinks, every reminder, gate, and deadline is off. Reconciling once up front keeps them in lockstep."
    - q: "My CCD is only a couple of days out and Scout warned about Phase 0 — is that a blocker?"
      a: "No. Phase 0 normally runs CCD-7→CCD (7 days). A nearer CCD squeezes that window, so Scout flags how many prep days remain, but you can still proceed (e.g. for a hotfix) or move the CCD out with set-ccd."
    - q: "The pipeline has no override — is that a problem?"
      a: "No. No override means the pipeline uses the same 2nd-Wednesday default the orchestrator does, so they already agree — that's a `match` (as long as the date is still in the future)."
    - q: "Scout couldn't read the pipeline — can I still proceed?"
      a: "Yes. On an unreadable pipeline the item falls back to attestation: you confirm the CCD manually and Scout records it with a note. It never silently passes."

readiness.mcp_servers:
  summary: "The MCP servers the release needs are registered in Scout."
  what: >
    Confirms the command-based MCP servers this release depends on are registered in
    your Scout config — ICM (on-call / incident lookups), Kusto/ADX (telemetry + the
    adx_access check), and Teams (comms gaps WorkIQ can't fill: group chats, channel
    posts). Auto-verified read-only against config/requirements.yaml; passes only if
    ALL are present.
  who: >
    Scout verifies it automatically (a Python verifier). Fixing a missing server is a
    one-time bootstrap step (register + restart Scout), not something the release does.
  where:
    - "Scout's registered servers: ~/.scout/m-mcp-servers.json"
    - "The required-servers manifest: config/requirements.yaml"
  how: >
    If it fails: run `python -m orchestrator.cli infra` (or setup/bootstrap.ps1) to
    auto-register the missing server(s), then RESTART Scout so it loads them, and
    re-run the gate. These are provided by the Agency CLI (agency mcp icm|kusto|teams);
    if Agency isn't installed, install it first. infra won't register a server whose
    launcher is missing.
  faqs:
    - q: "What happens if a server is missing?"
      a: "infra registers it (backing up your config first) and tells you to restart Scout. It refuses to register a server whose launcher isn't installed."
    - q: "Why is the Teams MCP required now?"
      a: "To cover Teams gaps WorkIQ can't (group-chat creation, adding members, rich channel messaging) — WorkIQ is 1:1-only."
    - q: "What's the empty-tools gotcha?"
      a: "Command servers must ship a populated `tools` allowlist; an empty one makes Scout silently drop the server. Our requirements.yaml ships icm/kusto/teams with populated lists."

readiness.silent_perms:
  summary: "Scout's permissions allow fully unattended (silent) runs."
  what: >
    Confirms shell, WorkIQ (email + Teams), the browser (Playwright), and the ICM +
    Kusto MCP servers are all auto-approved in Scout settings — so scheduled /
    background work (the daily digest, Teams reminders, CCOA-lockdown browser checks,
    the on-call & telemetry checks) runs WITHOUT stalling on a permission prompt when
    Scout isn't focused.
  who: >
    The skill checks it (reads m_get_settings — the engine can't see Scout's own
    settings). Enabling requires the user to flip one master toggle (only the user
    can). OPT-OUT: you may proceed without.
  where:
    - "Scout → Settings → Permissions — the per-server auto-approve flags."
    - "The master toggle: 'When blocked, let Scout ask instead of stopping' (allowModelPermissionsChange)."
  how: >
    If not all auto-approved, the skill offers 'Enable silent runs' — it requests
    auto-approval for WorkIQ/browser/ICM/Kusto (you click Allow once); if the master
    toggle is off you turn it on first. Or choose 'Proceed without' → recorded as
    `degraded`, which STILL clears the gate (⚠️ 'Proceeding (not silent)') but
    background checks will prompt and can stall until you open Scout.
  faqs:
    - q: "Does this block the release?"
      a: "No — it's soft/opt-out. `degraded` satisfies the gate; you just risk occasional prompts on unattended runs."
    - q: "Exactly what gets auto-approved?"
      a: "shell, workiq, playwright, kusto, icm."

readiness.teams_notify:
  summary: "The daily digest can also reach you over the Scout Teams bot."
  what: >
    Confirms the Teams relay is connected and the Scout bot is reachable, so the
    hourly `tick` digest can be delivered to you in Teams IN ADDITION to email. Email
    is the guaranteed channel; Teams is a bonus.
  who: >
    The skill checks it (m_relay_status / m_relay_connect + a silent
    m_send_teams_message handshake — the engine can't reach the relay). OPT-OUT.
  where:
    - "Channels are configured in config/notifications.yaml (channels.teams, teams.target: scout)."
    - "The Scout bot: open the Microsoft Scout chat in Teams."
  how: >
    If Teams is enabled in notifications.yaml, the skill connects the relay and sends
    a handshake. If the relay won't connect or the bot has no conversation yet (you've
    never messaged it), it records `degraded` (email-only) — which STILL clears the
    gate. To enable Teams later: open the Microsoft Scout chat in Teams and send it
    any message once, then re-run.
  faqs:
    - q: "Does this block the release?"
      a: "No — opt-out. If Teams is unreachable it records `degraded` and you get the digest by email only."
    - q: "How do I turn Teams delivery off?"
      a: "Set channels.teams: false in config/notifications.yaml — then this item passes as 'not requested'."

readiness.adx_access:
  summary: "You can query the ADX release-telemetry cluster."
  what: >
    Confirms you can query the ADX release dashboard's backing Kusto cluster (used for
    monitoring / Play vitals / crash metrics later in the release). Scout runs a
    `print 1` probe against the cluster.
  who: >
    The skill runs it (Kusto MCP — the engine can't reach the MCP) and records
    pass/fail. Fully verified (not attested).
  where:
    - "ADX release dashboard: https://dataexplorer.azure.com/dashboards/ab7abd7e-c36f-4ff0-88a7-aaa3ec014bd7"
    - "Backing cluster: https://idsharedeus2.eastus2.kusto.windows.net (db d496be22d62a46b0a3cf67ea2e736fd8)"
  how: >
    If it fails, you lack access to the cluster (or the Kusto MCP isn't reachable).
    Request access to the ADX cluster / dashboard, confirm the Kusto MCP is registered
    (see mcp_servers), then re-run the gate.
  faqs:
    - q: "What is the probe?"
      a: "A trivial `print 1` query against the cluster — it only proves you can connect and run a query, nothing about the data."

readiness.oncall_now:
  summary: "You are not the current Android primary on-call."
  what: >
    Confirms you are NOT the current primary on-call (OCE) for 'Auth Client Android
    Shield' (ICM team 78848) — a primary on-call shouldn't also be driving a release.
    A backup/secondary is fine; only the current PRIMARY blocks.
  who: >
    The skill checks it via ICM (get_on_call_schedule_by_team_id, team 78848 — the
    engine can't reach the MCP) and records pass/fail.
  where:
    - "On-call schedule: https://aka.ms/androidoncall (team: Auth Client Android Shield, ICM 78848)."
  how: >
    If you ARE the current primary, hand the release to someone who isn't (or wait
    until your shift ends), then re-run. Being a backup/secondary does NOT block — the
    skill records those as pass.
  faqs:
    - q: "I'm the backup on-call — does that block me?"
      a: "No. Only the current PRIMARY (first-listed current OCE) blocks. Backups are free to run the release."
    - q: "Why can't the primary on-call run the release?"
      a: "Primary on-call is expected to be responsive to incidents; combining it with release duty risks both. It's a required (non-opt-out) check."

readiness.play_console_access:
  summary: "You can open the Google Play Console app dashboard."
  what: >
    You ATTEST (Scout can't verify — Google auth wall) that you can sign into the
    Play Console and load the Authenticator app dashboard. Needed later for the Play
    vitals / policy-status review (Phase 0 `vitals`) and rollout management.
  who: "You confirm it — Scout cannot prove Google sign-in."
  where:
    - "Play Console app dashboard: https://play.google.com/console/u/0/developers/6720847872553662727/app/4972501392087484764/app-dashboard"
  how: >
    Open the dashboard and confirm it loads (you're signed into the right Google
    account with access to this app), then attest. If you can't load it, request Play
    Console access following the how-to doc below.
  links:
    - name: "How to access Google Play Console"
      url: "https://eng.ms/docs/microsoft-security/identity/entra-developer-application-platform/auth-client/authn-sdk-msal-android/android-auth-libraries/releases/combined-release-checklist/how-to-access-google-play-console"
  faqs:
    - q: "Why can't Scout verify this?"
      a: "Play Console is behind Google auth, which Scout can't automate — so you attest."
    - q: "How do I get access?"
      a: "Follow the 'How to access Google Play Console' doc (linked). Then open the dashboard to confirm."

readiness.oncall_window:
  summary: "You're not scheduled on-call during the release window."
  what: >
    You ATTEST you are NOT scheduled Android on-call at any point across the release
    window — CCD-7 through CCD+14 (the full stabilization period). This is the future
    counterpart to oncall_now (which only checks today); Scout can only see the
    current rotation, so you confirm the upcoming window.
  who: "You confirm it — Scout can't reliably read the future rotation."
  where:
    - "On-call schedule: https://aka.ms/androidoncall (team: Auth Client Android Shield). Check your shifts across the window."
  how: >
    Open the schedule, verify none of your on-call shifts fall in CCD-7 … CCD+14, then
    attest. If you ARE scheduled in that window, arrange coverage / a swap, or hand off
    the release.
  faqs:
    - q: "Why is this separate from 'Not on-call now'?"
      a: "oncall_now is auto (Scout reads today's roster); this is attest because Scout can't see the future schedule reliably."
    - q: "What's the window?"
      a: "CCD-7 to CCD+14 — pre-flight through the rollout / monitoring tail."

readiness.saw_ame:
  summary: "Your SAW machine and AME account are accessible."
  what: >
    You ATTEST you can log into your SAW (Secure Admin Workstation), the desktop
