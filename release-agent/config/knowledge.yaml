# Release Orchestrator — knowledge base for readiness items and YAML-only steps.
# Python-backed step modules (`steps/<phase>/<step>.py`) co-locate their own `KNOWLEDGE` dict.

version: 1
readiness.build_access:
  summary: You have permission to both ADO orgs the release builds from.
  what: 'Confirms you can reach the two build definitions this release drives — the BROKER pipelines in
    Engineering (Auth Client Android #2828, org identitydivision) and the AUTHENTICATOR pipelines in One
    (Android Build Release #397224, org msazure). Auto-verified via `az pipelines build definition show`;
    passes only if BOTH are accessible.

    '
  who: 'Scout verifies it automatically (a Python verifier — no user action) as long as you''re signed
    into az with access to both orgs.

    '
  where:
  - 'Broker (Engineering #2828): https://identitydivision.visualstudio.com/Engineering/_build?definitionId=2828'
  - 'Authenticator (One #397224): https://msazure.visualstudio.com/One/_build?definitionId=397224'
  how: 'If it fails: run `az login`, then confirm you have access to BOTH orgs/projects — Engineering
    (identitydivision) for the Broker pipelines and One (msazure) for the Authenticator pipelines. The
    two orgs authenticate separately, so a token good for one may not cover the other; request access
    to whichever org is failing. Re-run the gate once fixed.

    '
  faqs:
  - q: Why check two organizations?
    a: 'The Android release spans both: the Broker libraries build in Engineering (identitydivision) and
      the Authenticator app builds in One (msazure). You need permission to both.'
  - q: It failed with a 401 — what now?
    a: Usually you're not signed into az, or you lack access to one of the two orgs (they're separate).
      Sign in / request access to the failing org, then re-run the gate.
readiness.ccd_confirmed:
  summary: The Code Complete Date is a valid future date, reconciled with the pipeline.
  what: 'Validates the CCD end-to-end, because every phase is CCD-relative and a wrong CCD misaligns the
    whole run. Two hard checks (either BLOCKS): the CCD must be FUTURE-DATED — a past CCD (e.g. a current-month
    release whose 2nd-Wednesday default already passed) can''t be code-completed — and it must AGREE with
    pipeline 3155''s override. Plus one advisory: if the CCD leaves Phase 0 (CCD-7→CCD) with less than
    its normal 7-day window, Scout WARNS about the compressed prep window but lets you proceed.

    '
  who: 'Scout runs the check (`check-ccd`, reads the pipeline via az). On a past CCD or a differing pipeline
    override, Scout shows you the options and YOU decide the real date; Scout writes it with `set-ccd`.
    On a compressed Phase 0 window Scout warns and you choose to proceed or move the CCD out. If the pipeline
    can''t be read, you confirm the CCD manually (attest fallback).

    '
  where:
  - 'CCD override variable — Broker pipeline (Engineering #3155): https://identitydivision.visualstudio.com/Engineering/_build?definitionId=3155'
  how: 'Scout runs `check-ccd --json` and acts on the status: `past` → the CCD is before today; reschedule
    to a future date with `set-ccd --date <future> --confirm` (adopt a future pipeline override if one
    exists), re-check. `conflict` → pipeline override differs; pick which is right, `set-ccd`, re-check.
    `unreadable` → confirm the CCD by hand (attest). `match` → record the item pass. On `compressed: true`
    (any non-past status) Scout warns that Phase 0 has only `runway_days` of the normal 7 and lets you
    proceed or move the CCD.

    '
  faqs:
  - q: I started a release this month and the CCD is in the past — why?
    a: The default CCD is the 2nd Wednesday of the release month. If that day has already passed, the
      default is in the past and invalid. The gate blocks until you set a future Code Complete Date (or
      target a later release month).
  - q: Why does a CCD mismatch block the release?
    a: The phase schedule is computed from the CCD. If the pipeline is building to a different date than
      the orchestrator thinks, every reminder, gate, and deadline is off. Reconciling once up front keeps
      them in lockstep.
  - q: My CCD is only a couple of days out and Scout warned about Phase 0 — is that a blocker?
    a: No. Phase 0 normally runs CCD-7→CCD (7 days). A nearer CCD squeezes that window, so Scout flags
      how many prep days remain, but you can still proceed (e.g. for a hotfix) or move the CCD out with
      set-ccd.
  - q: The pipeline has no override — is that a problem?
    a: No. No override means the pipeline uses the same 2nd-Wednesday default the orchestrator does, so
      they already agree — that's a `match` (as long as the date is still in the future).
  - q: Scout couldn't read the pipeline — can I still proceed?
    a: 'Yes. On an unreadable pipeline the item falls back to attestation: you confirm the CCD manually
      and Scout records it with a note. It never silently passes.'
readiness.mcp_servers:
  summary: The MCP servers the release needs are registered in Scout.
  what: 'Confirms the command-based MCP servers this release depends on are registered in your Scout config
    — ICM (on-call / incident lookups), Kusto/ADX (telemetry + the adx_access check), and Teams (comms
    gaps WorkIQ can''t fill: group chats, channel posts). Auto-verified read-only against config/requirements.yaml;
    passes only if ALL are enabled with their required tool allowlists. This checks configuration, not
    live account/access; m365_access performs actual structured connector probes.

    '
  who: 'Scout verifies it automatically (a Python verifier). Fixing a missing server is a one-time bootstrap
    step (register + restart Scout), not something the release does.

    '
  where:
  - 'Scout''s registered servers: ~/.scout/m-mcp-servers.json'
  - 'The required-servers manifest: config/requirements.yaml'
  how: 'If it fails: run `python -m orchestrator.cli infra` (or setup/bootstrap.ps1) to auto-register
    the missing server(s), then RESTART Scout so it loads them, and re-run the gate. These are provided
    by the Agency CLI (agency mcp icm|kusto|teams); if Agency isn''t installed, install it first. infra
    won''t register a server whose launcher is missing.

    '
  faqs:
  - q: What happens if a server is missing?
    a: infra registers it (backing up your config first) and tells you to restart Scout. It refuses to
      register a server whose launcher isn't installed.
  - q: Why is the Teams MCP required now?
    a: The release uses Agency Teams for exact chat/member reads, direct-user notices and channel posts.
      Native WorkIQ also supports existing-chat sends; neither connector's presence alone proves access.
  - q: What's the empty-tools gotcha?
    a: Command servers must ship a populated `tools` allowlist; an empty one makes Scout silently drop
      the server. Our requirements.yaml ships icm/kusto/teams with populated lists.
readiness.m365_access:
  summary: Verify the actual M365 connectors and read capabilities before Phase 0.
  what: 'Confirms the current loaded tool inventory and fresh structured reads for the release owner''s
    profile/calendar, exact configured roster and all member pages, representative Teams chat/membership,
    and report site/library. Structured fetch is required through an actual exposed MCP tool OR the user''s
    existing native CLI. Azure CLI login and MCP registration alone do not prove these capabilities.

    '
  who: 'Scout runs the read-only tools from m365-capabilities and records their exact responses. Only
    validated account/argument/time/target-bound evidence can pass.

    '
  how: 'Run m365-capabilities --release <id>. Execute the exact supported native WorkIQ and Agency Teams
    reads. Inspect actual tools first; load agency-workiq-workiq instructions if useful. If MCP fetch
    is absent, use infra/onboarding --json discovery of the selected profile''s existing WorkIQ launcher
    and fetch --help. Execute exact planned Graph-relative URLs with workiq-read --scout-root <selected-existing-profile>
    [--workiq-path <existing-workiq-launcher>] --account <verified-owner> --entity-url ''<exact URL>''.
    Preserve the Scout wrapper argv, never shell-interpolate a URL or bypass its runner. Help is syntax
    proof, not access proof. Save the listed canonical observations and actual available_tools mapping,
    with the CLI structured_fetch descriptor separate, in a temporary file, then record-check --item m365_access
    --status pass --evidence-file <file>. Missing/disabled tools, denied paths, partial results, wrong
    accounts or stale observations hold before the release starts. Never invent an absent tool or use
    another identity/path to evade a policy denial. Correct host authentication/connector setup and rerun.
    Future Bug Bash event/chat access must still be verified when those resources exist; initial read
    probes do not grant send/upload permission. A compact routing recipe saved under the selected profile
    records account/targets/actual route/how-to only, no secrets/private responses/roster. Rediscover
    and reread on future setup; that cache is never a durable permission or pass.

    '
  faqs:
  - q: Does a successful read prove I can send or upload?
    a: No. Readiness checks read access only; it does not ask for blanket send/upload authorization. Check
      actual destination access and authorization at the owning write step, with its exact preview, required
      confirmation and provider receipt.
  - q: Do I need to add Hosted WorkIQ?
    a: No. The custom remote registration stays removed. Exact structured fetch can use an actual exposed
      MCP tool or the selected profile's existing native WorkIQ CLI. Discover that user's capability and
      verify live exact reads; absent MCP fetch or failed WorkIQ Ask does not prove CLI fetch unavailable.
      Missing launcher/version support holds with --workiq-path guidance. Never switch identity/transport
      after authentication failure or denial, replace membership with people search, or use Azure CLI
      Graph tokens.
readiness.teams_notify:
  summary: The daily digest can also reach you over the Scout Teams bot.
  what: 'Confirms the Teams relay is connected and the Scout bot is reachable, so the hourly `tick` digest
    can be delivered to you in Teams IN ADDITION to email. Email is the guaranteed channel; Teams is a
    bonus.

    '
  who: 'The skill checks it (m_relay_status / m_relay_connect + a silent m_send_teams_message handshake
    — the engine can''t reach the relay). OPT-OUT. This is an interactive setup diagnostic before signing,
    never a recurring-worker notification or fallback. Its one-time handshake contains no release payload.

    '
  where:
  - 'Channels are configured in config/notifications.yaml (channels.teams, teams.target: scout).'
  - 'The Scout bot: open the Microsoft Scout chat in Teams.'
  how: 'If Teams is enabled in notifications.yaml, the skill connects the relay and sends a handshake.
    If the relay won''t connect or the bot has no conversation yet (you''ve never messaged it), it records
    `degraded` (email-only) — which STILL clears the gate. To enable Teams later: open the Microsoft Scout
    chat in Teams and send it any message once, then re-run.

    '
  faqs:
  - q: Does this block the release?
    a: No — opt-out. If Teams is unreachable it records `degraded` and you get the digest by email only.
  - q: How do I turn Teams delivery off?
    a: 'Set channels.teams: false in config/notifications.yaml — then this item passes as ''not requested''.'
readiness.adx_access:
  summary: You can query the ADX release-telemetry cluster.
  what: 'Confirms you can query the ADX release dashboard''s backing Kusto cluster (used for monitoring
    / Play vitals / crash metrics later in the release). Scout runs a `print 1` probe against the cluster.

    '
  who: 'The skill runs it (Kusto MCP — the engine can''t reach the MCP) and records pass/fail. Fully verified
    (not attested).

    '
  where:
  - 'ADX release dashboard: https://dataexplorer.azure.com/dashboards/ab7abd7e-c36f-4ff0-88a7-aaa3ec014bd7'
  - 'Backing cluster: https://idsharedeus2.eastus2.kusto.windows.net (db d496be22d62a46b0a3cf67ea2e736fd8)'
  how: 'If it fails, you lack access to the cluster (or the Kusto MCP isn''t reachable). Request access
    to the ADX cluster / dashboard, confirm the Kusto MCP is registered (see mcp_servers), then re-run
    the gate.

    '
  faqs:
  - q: What is the probe?
    a: A trivial `print 1` query against the cluster — it only proves you can connect and run a query,
      nothing about the data.
readiness.oncall_now:
  summary: You are not the current Android primary on-call.
  what: 'Confirms you are NOT the current primary on-call (OCE) for ''Auth Client Android Shield'' (ICM
    team 78848) — a primary on-call shouldn''t also be driving a release. A backup/secondary is fine;
    only the current PRIMARY blocks.

    '
  who: 'The skill checks it via ICM (get_on_call_schedule_by_team_id, team 78848 — the engine can''t reach
    the MCP) and records pass/fail.

    '
  where:
  - 'On-call schedule: https://aka.ms/androidoncall (team: Auth Client Android Shield, ICM 78848).'
  how: 'If you ARE the current primary, hand the release to someone who isn''t (or wait until your shift
    ends), then re-run. Being a backup/secondary does NOT block — the skill records those as pass.

    '
  faqs:
  - q: I'm the backup on-call — does that block me?
    a: No. Only the current PRIMARY (first-listed current OCE) blocks. Backups are free to run the release.
  - q: Why can't the primary on-call run the release?
    a: Primary on-call is expected to be responsive to incidents; combining it with release duty risks
      both. It's a required (non-opt-out) check.
readiness.play_console_access:
  summary: You can open the Google Play Console app dashboard.
  what: 'You ATTEST (Scout can''t verify — Google auth wall) that you can sign into the Play Console and
    load the Authenticator app dashboard. Needed later for the Play vitals / policy-status review (Phase
    0 `vitals`) and rollout management.

    '
  who: You confirm it — Scout cannot prove Google sign-in.
  where:
  - 'Play Console app dashboard: https://play.google.com/console/u/0/developers/6720847872553662727/app/4972501392087484764/app-dashboard'
  how: 'Open the dashboard and confirm it loads (you''re signed into the right Google account with access
    to this app), then attest. If you can''t load it, request Play Console access following the how-to
    doc below.

    '
  links:
  - name: How to access Google Play Console
    url: https://eng.ms/docs/microsoft-security/identity/entra-developer-application-platform/auth-client/authn-sdk-msal-android/android-auth-libraries/releases/combined-release-checklist/how-to-access-google-play-console
  faqs:
  - q: Why can't Scout verify this?
    a: Play Console is behind Google auth, which Scout can't automate — so you attest.
  - q: How do I get access?
    a: Follow the 'How to access Google Play Console' doc (linked). Then open the dashboard to confirm.
readiness.oncall_window:
  summary: You're not scheduled on-call during the release window.
  what: 'You ATTEST you are NOT scheduled Android on-call at any point across the release window — CCD-7
    through CCD+14 (the full stabilization period). This is the future counterpart to oncall_now (which
    only checks today); Scout can only see the current rotation, so you confirm the upcoming window.

    '
  who: You confirm it — Scout can't reliably read the future rotation.
  where:
  - 'On-call schedule: https://aka.ms/androidoncall (team: Auth Client Android Shield). Check your shifts
    across the window.'
  how: 'Open the schedule, verify none of your on-call shifts fall in CCD-7 … CCD+14, then attest. If
    you ARE scheduled in that window, arrange coverage / a swap, or hand off the release.

    '
  faqs:
  - q: Why is this separate from 'Not on-call now'?
    a: oncall_now is auto (Scout reads today's roster); this is attest because Scout can't see the future
      schedule reliably.
  - q: What's the window?
    a: CCD-7 to CCD+14 — pre-flight through the rollout / monitoring tail.
readiness.saw_ame:
  summary: Your SAW machine and AME account are accessible.
  what: 'You ATTEST you can log into your SAW (Secure Admin Workstation), the desktop loads, and you can
    sign in with your AME (Azure Managed Environment) credentials — the secure environment required for
    privileged release actions.

    '
  who: You confirm it — Scout can't verify SAW/AME sign-in.
  where:
  - 'SAW: https://aka.ms/saw'
  how: 'Log into SAW (link below), confirm the desktop loads, and sign in with your AME credentials, then
    attest. If SAW or AME isn''t working, resolve access via the SAW portal before starting the release.

    '
  links:
  - name: SAW
    url: https://aka.ms/saw
  faqs:
  - q: Why is SAW/AME needed?
    a: Privileged release steps must run from the secure admin workstation with AME credentials — Scout
      can't prove that, so you attest.
readiness.yubikey:
  summary: You have a YubiKey in hand.
  what: 'You ATTEST you physically have your YubiKey — the hardware security key required for the release''s
    privileged sign-ins. Scout can''t verify a physical device, so you confirm.

    '
  who: You confirm it — it's a physical device.
  where:
  - No YubiKey? Pick one up at Studio A 1909, the Bldg 34/35 cafe, or order a DSR USB-C thumbdrive (link
    below).
  how: 'Have your YubiKey with you, then attest. If you don''t have one, get one first (Studio A 1909
    / Bldg 34-35 cafe) or order a DSR USB-C security key via the link.

    '
  links:
  - name: Order a DSR USB-C security key
    url: https://cloudmfa-support.azurewebsites.net/SecurityKeyServices/SecurityKey
  faqs:
  - q: I don't have a YubiKey — where do I get one?
    a: Studio A 1909, the Bldg 34/35 cafe, or order a DSR USB-C thumbdrive (linked).
bug_bash.ui_failures:
  summary: Release-owner investigation of EVERY Phase-2 UI failure — Broker MRWP + Authenticator ECS.
  what: 'A human-review checkpoint (owner: human, non-gate): before the bug bash proceeds, the release
    owner investigates the Phase-2 UI-automation failures. The list covers BOTH apps — the Broker MRWP
    UI suites (from the ECS + Local RC runs) AND the Authenticator ECS Firebase failures — and lists EVERY
    failing test individually (never collapsed to a per-suite stat). The step has no logic of its own;
    the earlier `ui_test_status` step forward-populates its Details with the full per-test list + run
    links (it just filled both suites and knows the failures), so the owner sees everything in one place.
    When nothing failed, the step shows its generic prompt and is a quick acknowledge.

    '
  who: 'The release owner investigates every failure and manually runs the tests. The owner does NOT touch
    the engine — they tell Scout when everything is investigated and executed, and Scout marks the step
    done (`done --step ui_failures`). It is a reminder, not a gate — it holds until the owner confirms
    completion but doesn''t require a formal approval.

    '
  how: 'Read the Details — a structured summary (like the bug-bash progress update): a header + a bold
    total-count line, then a **Broker (MRWP)** section and an **Authenticator (ECS)** section. EACH failing
    test is its own 🔬 line with source-result links and, when mapped, its ADO test case — Broker and Authenticator
    alike — and all are framed as investigations the RELEASE OWNER owns (flake vs real bug). Broker lines
    also carry their flight + suite context. The owner follows the run links, rules on each failure, and
    manually runs the affected tests. Once the owner tells Scout every failure has been investigated and
    executed, Scout closes the step with `done --step ui_failures`. If a chat retry replaced the generated
    Details with an invalidation note, read the completed fill''s investigation evidence via bugbash-progress
    --release <id>; do not rerun plan creation or result filling merely to reconstruct the review list.
    Missing source evidence is an error, never evidence that there are no failures.

    '
  faqs:
  - q: Does this include the Authenticator app failures?
    a: Yes. Every unresolved Broker MRWP UI and Authenticator ECS failure is included, including intentional
      Monthly report-only coverage and unmapped tests. Only cases actually written Failed are submitted
      for owner reassignment; check fill details for assignment errors.
  - q: Why are Broker failures shown the same way as Authenticator ones?
    a: All UI failures require release-owner investigation. Each retains a source-result link and a case
      link when one exists; unmapped tests are not forced into a plan. Assignment success is separately
      recorded.
  - q: Where does the failure list come from if this step has no code?
    a: From ui_test_status, which owns plan mapping/writes and publishes the full source failure list
      plus links onto this existing reminder. It preserves human notes and completion while refreshing
      generated evidence.
bug_bash.bugbash_complete:
  summary: The release owner attests the Bug Bash is finished — the gate that closes the bash.
  what: 'A human sign-off gate: the owner confirms the assigned tests have been run (or explicitly triaged/blocked)
    and the team agrees the bash is done. This includes the Authenticator ECS automation failures surfaced
    by `ui_test_status` for owner investigation — the owner reviews those and any assignment errors alongside
    manual results. Approving it advances the release out of Phase 3. It also STOPS the periodic updates.

    '
  who: 'The owner approves it (`approve` / `done --step bugbash_complete`). Until then — or until every
    test auto-completes — the `bug-bash-update-poller` keeps posting every 3h.

    '
  how: 'When the owner signs off, run `automation cleanup --release <id> --json`. For the returned bug-bash
    poller, call `m_delete_automation` first and deregister only after deletion succeeds. If all tests
    already completed, its `poll_complete` flag makes the same cleanup rule eligible only after the final
    summary delivery is acknowledged.

    '
  faqs:
  - q: Can I sign off before every single test passes?
    a: Yes — this is a judgement gate. If the remaining tests are triaged/blocked and the team agrees
      the bash is done, approve it. It doesn't require 100% pass; that's what the sign-off is for.
  - q: What about the failed Authenticator automation cases?
    a: Those are surfaced in ui_failures for owner investigation; check ui_test_status for any assignment
      errors. Review/triage them as part of sign-off — they don't block the gate, but you should have
      ruled on them before approving.
  - q: What stops the recurring chat updates?
    a: 'Two things make cleanup eligible: confirmed final-summary delivery records poll_complete, or the
      phase finishes. Initial bugbash_updates completion does not stop the phase-owned poller. Cleanup
      deletes the Scout automation first and deregisters after success.'
